<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>ELOCase - 註冊</title>


<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/register.css">

</head>


<body>


<main class="register-page">


<div class="register-card">


<h1>
建立 ELOCase 帳號
</h1>


<p class="register-subtitle">
加入 ELOCase，開始你的開箱旅程
</p>



<div class="form-group">

<label>
玩家名稱
</label>

<input
id="username"
type="text"
placeholder="輸入玩家名稱"
>

</div>



<div class="form-group">

<label>
顯示名稱
</label>

<input
id="displayName"
type="text"
placeholder="公開顯示名稱"
>

</div>



<div class="form-group">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="example@email.com"
>

</div>



<div class="form-group">

<label>
密碼
</label>

<input
id="password"
type="password"
placeholder="輸入密碼"
>

</div>



<div class="form-group">

<label>
確認密碼
</label>

<input
id="confirmPassword"
type="password"
placeholder="再次輸入密碼"
>

</div>



<button
id="register-button"
class="primary-button"
>

建立帳號

</button>



<div
id="register-message"
class="form-message"
>
</div>



<p class="login-link">

已經有帳號？

<a href="login.html">
立即登入
</a>

</p>


</div>


</main>



<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/register.js"></script>


</body>

</html>
