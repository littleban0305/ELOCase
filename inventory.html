<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的物品｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/inventory.css">
</head>

<body>

<header class="navbar">

    <div class="navbar-container">

        <a href="index.html" class="brand">
            ELOCase
        </a>

        <nav class="nav-links">

            <a href="index.html" class="nav-link">
                首頁
            </a>

            <a href="cases.html" class="nav-link">
                開箱
            </a>

            <a href="inventory.html" class="nav-link active">
                我的物品
            </a>

            <a href="profile.html" class="nav-link">
                個人資料
            </a>

        </nav>

        <div class="navbar-actions">

            <div class="balance">

                <span class="balance-label">$</span>

                <span
                    class="balance-value"
                    id="navbar-balance"
                >
                    50
                </span>

            </div>

            <div class="player-menu">
                
                    <button
                        type="button"
                        class="player-menu-button"
                        id="player-menu-button"
                    >
                
                        <span class="player-avatar">
                            ◉
                        </span>
                
                        <span
                            class="player-menu-name"
                            id="navbar-player-name"
                        >
                            登入
                        </span>
                
                        <span class="player-menu-arrow">
                            ▾
                        </span>
                
                    </button>
                
                
                    <div
                        class="player-menu-dropdown"
                        id="player-menu-dropdown"
                    >
                
                        <a
                            href="profile.html"
                            class="player-menu-item"
                        >
                            個人資料
                        </a>
                
                
                        <a
                            href="inventory.html"
                            class="player-menu-item"
                        >
                            我的物品
                        </a>
                
                
                        <button
                            type="button"
                            class="player-menu-item player-menu-logout"
                            id="navbar-logout-button"
                        >
                            登出
                        </button>
                
                    </div>
                
                </div>

        </div>

    </div>

</header>


<main>

    <section class="section-container inventory-page">

        <div class="section-header">

            <span class="section-label">
                收藏
            </span>

            <h1>
                我的物品
            </h1>

        </div>


        <div class="inventory-toolbar">

            <div class="inventory-count">
                共 <strong id="inventory-count">0</strong> 件物品
            </div>

            <label class="inventory-search">

                <span>搜尋物品</span>

                <input
                    id="inventory-search"
                    type="search"
                    placeholder="輸入武器或造型名稱"
                    autocomplete="off"
                >

            </label>

        </div>


        <div
            id="inventory-grid"
            class="inventory-grid"
        >

            <div class="inventory-loading">
                正在載入物品...
            </div>

        </div>

    </section>

</main>


<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/inventory.js"></script>

</body>

</html>
