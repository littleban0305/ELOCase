<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI 助手｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin-ai.css">
</head>


<body>


<main>

<section class="section-container ai-page">


    <div class="section-header">

        <span class="section-label">
            ELOCase
        </span>

        <h1>
            AI 助手
        </h1>

    </div>


    <div class="ai-layout">


        <!-- ========================================
             左側
        ======================================== -->

        <div class="ai-panel">

            <div class="ai-panel-title">
                生成收藏資料
            </div>


            <div class="ai-panel-subtitle">

                描述你想建立的收藏系列，
                AI 會搜尋資料並整理成 ELOCase 格式。
                生成後可以手動修改。

            </div>


            <textarea
                id="ai-prompt"
                class="ai-prompt"
                placeholder="例如：幫我建立一組 8 個 CS2 步槍收藏品，包含不同稀有度與磨損程度"
            ></textarea>

            <button
                id="ai-generate"
                class="button button-primary ai-generate-button"
                type="button"
            >
                ✦ 生成資料
            </button>

            <div class="ai-analysis-panel" id="ai-analysis-panel">
            
                <div class="ai-analysis-title">
                    箱子分析師
                </div>
            
                <div
                    class="ai-analysis-content"
                    id="ai-analysis-content"
                >
                    <div class="ai-analysis-empty">
                        生成箱子後，
                        AI 會自動分析價格、權重與合理度
                    </div>
                </div>
            
            </div>

        </div>


        <!-- ========================================
             右側
        ======================================== -->

        <div
            class="ai-result"
            id="ai-result"
        >

            <div class="ai-empty">

                <div>

                    <div>
                        等待 AI 生成
                    </div>

                    <div style="margin-top:6px;">
                        生成後可以直接修改資料
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</main>


<script>


/* ========================================
   API
======================================== */

const AI_API_URL =
    "https://script.google.com/macros/s/AKfycbzfCdLdBUEv2tXaguqS0Fm9uf9PslygEYpL16eYrKVqEdoX9Z6AMpfU0Wd7xIUmI7FfDg/exec";


/* ========================================
   DOM
======================================== */

const promptInput =
    document.querySelector(
        "#ai-prompt"
    );


const generateButton =
    document.querySelector(
        "#ai-generate"
    );


const resultContainer =
    document.querySelector(
        "#ai-result"
    );


/* ========================================
   目前 AI 資料
======================================== */

let currentAIData = null;

// 防止「加入 Items」重複送出
let isSavingAIItems = false;


/* ========================================
   生成 AI
======================================== */

async function generateAI() {

    const prompt =
        promptInput.value.trim();


    if (!prompt) {

        promptInput.focus();

        return;

    }


    generateButton.disabled =
        true;

    generateButton.textContent =
        "AI 生成中...";


    resultContainer.innerHTML = `

        <div class="ai-loading">

            <div class="ai-spinner"></div>

            <div>
                AI 正在搜尋與整理資料...
            </div>

        </div>

    `;


    try {

        const response =
            await fetch(
                AI_API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "generateAI",

                            prompt:
                                prompt

                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "AI Result:",
            result
        );


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "AI 生成失敗"
            );

        }


        console.log(
            "🔥 generateAI result.data =",
            result.data
        );
        
        console.log(
            "🔥 generateAI casePrice =",
            result.data?.casePrice
        );

        if (
            !result.data.casePrice &&
            result.data.price
        ) {
        
            result.data.casePrice =
                result.data.price;
        
        }
        
        currentAIData =
            JSON.parse(
                JSON.stringify(
                    result.data
                )
            );
        
        console.log(
            "🔥 currentAIData =",
            currentAIData
        );
        
        console.log(
            "🔥 currentAIData.casePrice =",
            currentAIData?.casePrice
        );


        renderAIResult(
            currentAIData
        );

        analyzeCurrentCase();


    } catch (error) {

        console.error(
            "AI Error:",
            error
        );


        resultContainer.innerHTML = `

            <div class="ai-error">

                ${escapeHTML(
                    error.message ||
                    "AI 生成失敗"
                )}

            </div>

        `;

    } finally {

        generateButton.disabled =
            false;

        generateButton.textContent =
            "✦ 生成資料";

    }

}


/* ========================================
   顯示結果
======================================== */

function renderAIResult(data) {

    console.log(
        "🔥 renderAIResult data.casePrice",
        data.casePrice
    );
    
    console.log(
        "🔥 renderAIResult data.price",
        data.price
    );

    const items =
        Array.isArray(data.items)
            ? [...data.items]
            : [];


    items.sort(
        (a, b) =>
            Number(b.value || 0) -
            Number(a.value || 0)
    );


    resultContainer.innerHTML = `

        <div class="ai-result-header">

            <div style="flex:1;">

                <div class="ai-field">

                    <label class="ai-field-label">
                        收藏系列名稱
                    </label>

                    <input
                        type="text"
                        id="ai-collection-name"
                        class="ai-input"
                        value="${escapeAttribute(
                            data.name || ""
                        )}"
                    >

                    <div class="ai-field">
                    
                        <label class="ai-field-label">
                            箱子價格 USD
                        </label>
                    
                        <input
                            type="number"
                            id="ai-case-price"
                            class="ai-input"
                            min="0"
                            step="0.01"
                            value="${Number(
                                data.casePrice ??
                                data.price ??
                                2.5
                            )}"
                        >
                    
                    </div>

                </div>

            </div>


            <div style="display:flex; gap:8px;">
            
                <button
                    type="button"
                    class="button"
                    id="copy-ai-json"
                >
                    ⧉ 複製 JSON
                </button>
            
                <button
                    type="button"
                    class="button button-primary ai-save-button"
                    id="save-ai-items"
                >
                    加入 Items
                </button>
            
            </div>

        </div>


        <div class="ai-result-count">
            ${items.length} 個物品
        </div>


        <div class="ai-items">

            ${
                items
                    .map(
                        (item, index) =>
                            renderAIItem(
                                item,
                                index
                            )
                    )
                    .join("")
            }

        </div>


        <button
            type="button"
            class="ai-add-item"
            id="ai-add-item"
        >
            ＋ 新增物品
        </button>

    `;


    /*
     * ========================================
     * 綁定事件
     * ========================================
     */

    bindResultEvents();

}


/* ========================================
   單一物品
======================================== */

function renderAIItem(
    item,
    index
) {

    const rarity =
        String(
            item.rarity || ""
        ).trim();


    const wear =
        String(
            item.wear || ""
        ).trim();


    const color =
        getRarityColorFrontend(
            rarity
        );


    return `
    
        <div
            class="ai-item"
            data-index="${index}"
            data-color="${escapeAttribute(color)}"
            data-image-url="${escapeAttribute(item.imageUrl || "")}"
        >
    
            <div class="ai-item-image" data-image-preview>
            
                ${
                    item.imageUrl
                        ? `
                            <img
                                src="${escapeAttribute(item.imageUrl)}"
                                alt="${escapeAttribute(item.name || "物品圖片")}"
                                loading="lazy"
                                onerror="showImageError(this)"
                            >
                        `
                        : `
                            <div class="ai-item-image-empty">
                                尚無圖片
                            </div>
                        `
                }
            
            </div>
            
            
            <div class="ai-field">
            
                <label class="ai-field-label">
                    圖片 URL
                </label>
            
                <input
                    type="url"
                    class="ai-input ai-edit-image-url"
                    value="${escapeAttribute(item.imageUrl || "")}"
                    placeholder="https://..."
                >
            
            </div>
    
    
            <div class="ai-item-top">
    
                <span class="ai-item-number">
                    物品 ${index + 1}
                </span>
    
    
                <button
                    type="button"
                    class="ai-remove-button"
                    data-remove-index="${index}"
                >
                    移除
                </button>
    
            </div>
    
    
            <div class="ai-field">
    
                <label class="ai-field-label">
                    物品名稱
                </label>
    
                <input
                    type="text"
                    class="ai-input ai-edit-name"
                    value="${escapeAttribute(
                        item.name || ""
                    )}"
                >
    
            </div>

            <div class="ai-field">
                <label class="ai-field-label">
                    Steam Market Hash Name
                </label>
                <input
                    type="text"
                    class="ai-input ai-edit-market-hash-name"
                    value="${escapeAttribute(item.marketHashName || "")}"
                    placeholder="AK-47 | Slate (Field-Tested)"
                >
            </div>
    
            <div class="ai-field-row">
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        稀有度
                    </label>
    
                    <select
                        class="ai-select ai-edit-rarity"
                    >
    
                        ${rarityOptions(
                            rarity
                        )}
    
                    </select>
    
                </div>
    
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        顏色
                    </label>
    
                    <input
                        type="text"
                        class="ai-input ai-edit-color"
                        value="${escapeAttribute(
                            color
                        )}"
                        readonly
                    >
    
                </div>
    
            </div>
    
    
            <div class="ai-field-row">
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        磨損
                    </label>
    
                    <select
                        class="ai-select ai-edit-wear"
                    >
    
                        ${wearOptions(
                            wear
                        )}
    
                    </select>
    
                </div>
    
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        價值 USD
                    </label>
    
                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        class="ai-input ai-edit-value"
                        value="${Number(
                            item.value || 0
                        )}"
                    >
    
                </div>

                <div class="ai-field">
                
                    <label class="ai-field-label">
                        掉落權重
                    </label>
                
                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        class="ai-input ai-edit-weight"
                        value="${Number(item.rarityWeight ?? 1)}"
                    >
                
                </div>
    
            </div>
    
        </div>
    
    `;

}

function updateItemColor(card) {

    const raritySelect =
        card.querySelector(
            ".ai-edit-rarity"
        );

    const colorInput =
        card.querySelector(
            ".ai-edit-color"
        );


    if (
        !raritySelect ||
        !colorInput
    ) {

        return;

    }


    const color =
        getRarityColorFrontend(
            raritySelect.value
        );


    colorInput.value =
        color;


    card.dataset.color =
        color;

}


/* ========================================
   稀有度
======================================== */

function rarityOptions(
    current
) {

    const options = [

        "Consumer Grade",
        "Industrial Grade",
        "Mil-Spec",
        "Restricted",
        "Classified",
        "Covert",
        "Exceedingly Rare",
        "Contraband"

    ];


    return options
        .map(
            option => `

                <option
                    value="${escapeAttribute(option)}"
                    ${
                        option === current
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(option)}
                </option>

            `
        )
        .join("");

}


/* ========================================
   顏色
======================================== */

function colorOptions(
    current
) {

    const options = [

        "White",
        "Light Blue",
        "Blue",
        "Purple",
        "Pink",
        "Red",
        "Gold",
        "Orange"

    ];


    return options
        .map(
            option => `

                <option
                    value="${escapeAttribute(option)}"
                    ${
                        option === current
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(option)}
                </option>

            `
        )
        .join("");

}


/* ========================================
   Wear
======================================== */

function wearOptions(
    current
) {

    const options = [

        "Factory New (FN)",
        "Minimal Wear (MW)",
        "Field-Tested (FT)",
        "Well-Worn (WW)",
        "Battle-Scarred (BS)"

    ];


    return options
        .map(
            option => `

                <option
                    value="${escapeAttribute(option)}"
                    ${
                        option === current
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(option)}
                </option>

            `
        )
        .join("");

}


/* ========================================
   綁定結果事件
======================================== */

function bindResultEvents() {

    const saveButton =
        document.querySelector(
            "#save-ai-items"
        );


    if (saveButton) {
        saveButton.onclick = saveAIItems;
    }


    const addButton =
        document.querySelector(
            "#ai-add-item"
        );


    if (addButton) {

        addButton.addEventListener(
            "click",
            addNewAIItem
        );

    }


    document
        .querySelectorAll(
            "[data-remove-index]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        removeAIItem(
                            Number(
                                button.dataset.removeIndex
                            )
                        );

                    }
                );

            }
        );


    /*
     * ========================================
     * Rarity 改變時自動更新 Color
     * ========================================
     */

    document
        .querySelectorAll(
            ".ai-edit-rarity"
        )
        .forEach(
            select => {

                select.addEventListener(
                    "change",
                    () => {

                        updateItemColor(
                            select.closest(
                                ".ai-item"
                            )
                        );

                    }
                );

            }
        );

    document
        .querySelectorAll(".ai-edit-image-url")
        .forEach(
            input => {
    
                input.addEventListener(
                    "input",
                    () => {
    
                        const card =
                            input.closest(".ai-item");
    
                        const preview =
                            card.querySelector(
                                "[data-image-preview]"
                            );
    
                        if (!preview) {
                            return;
                        }
    
                        const url =
                            input.value.trim();
    
                        if (!url) {
    
                            preview.innerHTML = `
                                <div class="ai-item-image-empty">
                                    尚無圖片
                                </div>
                            `;
    
                            return;
    
                        }
    
                        preview.innerHTML = `
                            <img
                                src="${escapeAttribute(url)}"
                                alt="物品圖片"
                                loading="lazy"
                                onerror="showImageError(this)"
                            >
                        `;
    
                    }
                );
    
            }
        );

    const copyButton =
        document.querySelector(
            "#copy-ai-json"
        );
    
    
    if (copyButton) {
    
        copyButton.onclick =
            copyAIJson;
    
    }

}


/* ========================================
   新增物品
======================================== */

function addNewAIItem() {

    if (!currentAIData) {

        return;

    }


    if (
        currentAIData.items.length >= 12
    ) {

        alert(
            "最多只能有 12 個物品"
        );

        return;

    }


    currentAIData.items.push({
    
        name:
            "",
    
        rarity:
            "Mil-Spec",
    
        color:
            "Blue",
    
        wear:
            "Factory New (FN)",
    
        value:
            0,
    
        imageUrl:
            ""
    
    });


    renderAIResult(
        currentAIData
    );

}


/* ========================================
   移除物品
======================================== */

function removeAIItem(
    index
) {

    if (!currentAIData) {

        return;

    }


    if (
        index < 0 ||
        index >= currentAIData.items.length
    ) {

        return;

    }


    currentAIData.items.splice(
        index,
        1
    );


    renderAIResult(
        currentAIData
    );

}

function buildAIJson() {
    const data = collectEditedData();
    if (
        !Number.isFinite(data.casePrice) ||
        data.casePrice <= 0
    ) {
    
        analysisContent.innerHTML = `
    
            <div class="ai-analysis-empty">
    
                請先填寫有效的箱子價格 USD，
                再進行箱子分析。
    
            </div>
    
        `;
    
        return;
    
    }
    const totalWeight = data.items.reduce(function(total, item) {
        return total + item.rarityWeight;
    }, 0);

    if (totalWeight <= 0) {
        throw new Error("所有物品的掉落權重不能全部為 0");
    }

    return JSON.stringify({
        collection: {
            name: data.name,
            casePrice: data.casePrice,
            game: "CS2"
        },
        items: data.items.map(function(item) {
            return {
                name: item.name,
                marketHashName: item.marketHashName || "",
                rarity: item.rarity,
                color: item.color,
                wear: item.wear,
                value: item.value,
                rarityWeight: item.rarityWeight,
                probability: Number(
                    (item.rarityWeight / totalWeight * 100).toFixed(4)
                ),
                imageUrl: item.imageUrl || ""
            };
        })
    }, null, 2);
}

async function copyAIJson() {

    try {

        const json =
            buildAIJson();


        await navigator.clipboard.writeText(
            json
        );


        const button =
            document.querySelector(
                "#copy-ai-json"
            );


        if (button) {

            const originalText =
                button.textContent;

            button.textContent =
                "✓ 已複製";

            setTimeout(
                () => {

                    button.textContent =
                        originalText;

                },
                1500
            );

        }


        console.log(
            "AI JSON：",
            json
        );


    } catch (error) {

        console.error(
            "複製 JSON 失敗：",
            error
        );


        alert(
            "複製 JSON 失敗：" +
            error.message
        );

    }

}

/* ========================================
   讀取目前畫面上的修改
======================================== */

function collectEditedData() {

    if (!currentAIData) {

        return null;

    }


    const collectionName =
        document.querySelector(
            "#ai-collection-name"
        )?.value.trim();

    const casePrice =
        Number(
            document.querySelector(
                "#ai-case-price"
            )?.value
        );

    console.log(
        "🔥 DOM #ai-case-price value =",
        document.querySelector(
            "#ai-case-price"
        )?.value
    );
    
    console.log(
        "🔥 collectEditedData casePrice =",
        casePrice
    );

    if (
        !Number.isFinite(casePrice) ||
        casePrice < 0
    ) {
    
        throw new Error(
            "箱子價格無效"
        );
    
    }


    if (!collectionName) {

        throw new Error(
            "收藏系列名稱不能為空"
        );

    }


    const cards =
        document.querySelectorAll(
            ".ai-item"
        );


    if (
        cards.length === 0
    ) {

        throw new Error(
            "至少需要一個物品"
        );

    }


    const items = [];


    cards.forEach(
        card => {

            const name =
                card.querySelector(
                    ".ai-edit-name"
                ).value.trim();


            const rarity =
                card.querySelector(
                    ".ai-edit-rarity"
                ).value;


            const color =
                getRarityColorFrontend(
                    rarity
                );


            const wear =
                card.querySelector(
                    ".ai-edit-wear"
                ).value;


            const value =
                Number(
                    card.querySelector(
                        ".ai-edit-value"
                    ).value
                );

            const rarityWeight =
                Number(
                    card.querySelector(
                        ".ai-edit-weight"
                    ).value
                );

            if (
                !Number.isFinite(rarityWeight) ||
                rarityWeight < 0
            ) {
                throw new Error(
                    `${name} 的掉落權重無效`
                );
            }


            if (!name) {

                throw new Error(
                    "有物品名稱尚未填寫"
                );

            }


            if (
                !Number.isFinite(value) ||
                value < 0
            ) {

                throw new Error(
                    `${name} 的價格無效`
                );

            }


            items.push({
                name: name,
                rarity: rarity,
                color: color,
                wear: wear,
                value: value,
                imageUrl: card.querySelector(".ai-edit-image-url").value.trim(),
                marketHashName:
                    card.querySelector(
                        ".ai-edit-market-hash-name"
                    ).value.trim(),
                rarityWeight: rarityWeight
            });

        }
    );


    return {
    
        name:
            collectionName,
    
        casePrice:
            casePrice,
    
        items:
            items
    
    };

}


/* ========================================
   加入 Items
======================================== */

async function saveAIItems() {

    // ========================================
    // 防止重複點擊 / 重複 POST
    // ========================================

    if (isSavingAIItems) {

        console.log(
            "⚠️ 已經正在加入 Items，忽略這次操作"
        );

        return;

    }

    isSavingAIItems = true;


    let data;


    try {

        data =
            collectEditedData();

    } catch (error) {

        isSavingAIItems = false;

        alert(
            error.message
        );

        return;

    }


    const token =
        localStorage.getItem(
            "elocaseSessionToken"
        );


    if (!token) {

        isSavingAIItems = false;

        alert(
            "登入狀態已失效，請重新登入"
        );

        return;

    }


    /*
     * ========================================
     * 價格高 → 低
     * ========================================
     */

    data.items.sort(
        (a, b) =>
            Number(b.value) -
            Number(a.value)
    );


    const button =
        document.querySelector(
            "#save-ai-items"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "加入中...";

    }


    try {

        const response =
            await fetch(
                AI_API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({
                    
                            action:
                                "saveAIItems",
                    
                            token:
                                token,
                    
                            collectionName:
                                data.name,
                    
                            casePrice:
                                data.casePrice,
                    
                            items:
                                data.items
                    
                        })

                }
            );


        const result =
            await response.json();


        console.log(

            result
        );


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "加入 Items 失敗"
            );

        }


        /*
         * ====================================
         * 成功
         * ====================================
         */

        if (button) {

            button.textContent =
                "✓ 已加入 Items";

            button.disabled =
                true;

        }


        alert(
            `成功加入 ${result.data.count} 個物品\n\n` +
            `箱子：${result.data.caseName}`
        );


        /*
         * ====================================
         * 成功後保持鎖定
         *
         * 防止再次建立同一個箱子
         * ====================================
         */

        // isSavingAIItems 保持 true


    } catch (error) {

        console.error(
            "Save AI Items Error:",
            error
        );


        alert(
            error.message ||
            "加入 Items 失敗"
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "加入 Items";

        }


        /*
         * ====================================
         * 失敗 → 解除鎖定
         * 使用者可以重新嘗試
         * ====================================
         */

        isSavingAIItems = false;

    }

}


/* ========================================
   HTML Escape
======================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}

function getRarityColorFrontend(
    rarity
) {

    const map = {

        "Consumer Grade":
            "White",

        "Industrial Grade":
            "Light Blue",

        "Mil-Spec":
            "Blue",

        "Restricted":
            "Purple",

        "Classified":
            "Pink",

        "Covert":
            "Red",

        "Exceedingly Rare":
            "Gold",

        "Contraband":
            "Orange"

    };


    return map[
        String(
            rarity || ""
        ).trim()
    ] || "White";

}

/* ========================================
   AI 箱子分析師
======================================== */

let currentAIAnalysis = null;


async function analyzeCurrentCase() {

    if (!currentAIData) {

        return;

    }


    const analysisContent =
        document.querySelector(
            "#ai-analysis-content"
        );


    if (!analysisContent) {

        return;

    }


    analysisContent.innerHTML = `

        <div class="ai-analysis-loading">

            <div class="ai-spinner"></div>

            <div>
                Gemini 正在分析箱子...
            </div>

        </div>

    `;


    try {

        if (
            currentAIData &&
            !currentAIData.casePrice
        ) {
            currentAIData.casePrice =
                currentAIData.price;
        }

        const data =
            collectEditedData();

        console.log(
            "🔥 analyzeCurrentCase data =",
            data
        );
        
        console.log(
            "🔥 analyzeCurrentCase casePrice =",
            data?.casePrice
        );


        const response =
            await fetch(
                AI_API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "analyzeCase",

                            caseData:
                                data

                        })

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "箱子分析失敗"
            );

        }


        currentAIAnalysis =
            result.data;


        renderAIAnalysis(
            currentAIAnalysis
        );


    } catch (error) {

        console.error(
            "AI Analysis Error:",
            error
        );


        analysisContent.innerHTML = `

            <div class="ai-error">

                ${escapeHTML(
                    error.message ||
                    "箱子分析失敗"
                )}

            </div>

        `;

    }

}

function renderAIAnalysis(data) {

    const container =
        document.querySelector(
            "#ai-analysis-content"
        );


    if (!container) {

        return;

    }


    /*
     * ========================================
     * 基本防呆
     * ========================================
     */

    if (
        !data ||
        typeof data !== "object"
    ) {

        container.innerHTML = `

            <div class="ai-error">

                AI 回傳的分析資料無效

            </div>

        `;

        return;

    }


    /*
     * ========================================
     * 讀取分析資料
     * ========================================
     */

    const analysisScore =
        Number(
            data.analysisScore
        );


    const casePrice =
        Number(
            data.casePrice
        );


    const targetReturnRate =
        Number(
            data.targetReturnRate
        );


    const targetEV =
        Number(
            data.targetEV
        );


    const currentEV =
        Number(
            data.currentEV
        );


    const currentReturnRate =
        Number(
            data.currentReturnRate
        );


    const optimizedEV =
        Number(
            data.optimizedEV
        );


    const optimizedReturnRate =
        Number(
            data.optimizedReturnRate
        );


    const evErrorPercent =
        Number(
            data.evErrorPercent
        );


    const totalWeight =
        Number(
            data.totalWeight
        );


    /*
     * ========================================
     * 安全格式化數字
     * ========================================
     */

    function formatNumber(
        value,
        decimals = 2
    ) {

        if (
            !Number.isFinite(value)
        ) {

            return "0.00";

        }


        return value.toFixed(
            decimals
        );

    }


    /*
     * ========================================
     * 警告
     * ========================================
     */

    let warningsHTML = "";


    if (
        Array.isArray(
            data.warnings
        ) &&
        data.warnings.length
    ) {

        warningsHTML = `

            <div class="ai-analysis-section">

                <div class="ai-analysis-label">
                    注意事項
                </div>

                ${
                    data.warnings
                        .map(
                            warning => `
                                <div
                                    style="
                                        margin-bottom:5px;
                                    "
                                >
                                    •
                                    ${escapeHTML(
                                        warning
                                    )}
                                </div>
                            `
                        )
                        .join("")
                }

            </div>

        `;

    } else if (
        data.warnings
    ) {

        warningsHTML = `

            <div class="ai-analysis-section">

                <div class="ai-analysis-label">
                    注意事項
                </div>

                <div>
                    ${escapeHTML(
                        String(
                            data.warnings
                        )
                    )}
                </div>

            </div>

        `;

    }


    /*
     * ========================================
     * 最佳化物品
     * ========================================
     */

    const items =
        Array.isArray(
            data.items
        )
            ? data.items
            : [];


    let itemsHTML = "";


    if (
        items.length
    ) {

        itemsHTML = `

            <div class="ai-analysis-section">

                <div class="ai-analysis-label">
                    最佳化權重
                </div>

                ${
                    items.map(
                        item => {

                            const currentWeight =
                                Number(
                                    item.currentWeight
                                );


                            const suggestedWeight =
                                Number(
                                    item.suggestedWeight
                                );


                            const value =
                                Number(
                                    item.value
                                );


                            const weightChanged =
                                Number.isFinite(
                                    currentWeight
                                ) &&
                                Number.isFinite(
                                    suggestedWeight
                                ) &&
                                currentWeight !==
                                suggestedWeight;


                            return `

                                <div
                                    class="ai-analysis-item"
                                >

                                    <div
                                        class="ai-analysis-item-name"
                                    >
                                        ${escapeHTML(
                                            item.marketHashName ||
                                            item.name ||
                                            "未知物品"
                                        )}
                                    </div>


                                    <div
                                        class="ai-analysis-item-meta"
                                    >

                                        價值：
                                        $${formatNumber(
                                            value
                                        )}

                                        ・目前權重：
                                        ${formatNumber(
                                            currentWeight
                                        )}

                                        ・建議權重：
                                        <strong>
                                            ${formatNumber(
                                                suggestedWeight
                                            )}
                                        </strong>

                                    </div>


                                    ${
                                        item.reason
                                            ? `
                                                <div
                                                    class="ai-analysis-item-meta"
                                                    style="
                                                        margin-top:4px;
                                                    "
                                                >
                                                    ${escapeHTML(
                                                        item.reason
                                                    )}
                                                </div>
                                            `
                                            : ""
                                    }

                                </div>

                            `;

                        }
                    ).join("")
                }

            </div>

        `;

    }


    /*
     * ========================================
     * 分析師建議
     * ========================================
     */

    let recommendationHTML = "";


    if (
        data.recommendation
    ) {

        recommendationHTML = `

            <div class="ai-analysis-section">

                <div class="ai-analysis-label">
                    分析師建議
                </div>

                <div>
                    ${escapeHTML(
                        data.recommendation
                    )}
                </div>

            </div>

        `;

    }


    /*
     * ========================================
     * 分析結果
     * ========================================
     */

    container.innerHTML = `

        <!-- ====================================
             合理度
        ==================================== -->

        <div class="ai-analysis-score">

            <div>

                <div class="ai-analysis-label">
                    合理度
                </div>

                <div class="ai-analysis-score-number">

                    ${
                        Number.isFinite(
                            analysisScore
                        )
                            ? formatNumber(
                                analysisScore,
                                1
                            )
                            : "0.0"
                    }

                    / 10

                </div>

            </div>

        </div>


        <!-- ====================================
             箱子價格
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                箱子價格
            </div>

            <div class="ai-analysis-value">

                $${formatNumber(
                    casePrice
                )}

            </div>

        </div>


        <!-- ====================================
             目前 EV
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                目前期望值
            </div>

            <div class="ai-analysis-value">

                $${formatNumber(
                    currentEV
                )}

            </div>

        </div>


        <!-- ====================================
             目前回報率
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                目前回報率
            </div>

            <div class="ai-analysis-value">

                ${formatNumber(
                    currentReturnRate
                )}%

            </div>

        </div>


        <!-- ====================================
             目標
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                目標回報率
            </div>

            <div class="ai-analysis-value">

                ${formatNumber(
                    targetReturnRate
                )}%

                ・目標 EV：

                $${formatNumber(
                    targetEV
                )}

            </div>

        </div>


        <!-- ====================================
             最佳化 EV
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                最佳化後期望值
            </div>

            <div class="ai-analysis-value">

                $${formatNumber(
                    optimizedEV
                )}

            </div>

        </div>


        <!-- ====================================
             最佳化回報率
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                最佳化後回報率
            </div>

            <div class="ai-analysis-value">

                ${formatNumber(
                    optimizedReturnRate
                )}%

            </div>

        </div>


        <!-- ====================================
             EV 誤差
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                EV 目標誤差
            </div>

            <div class="ai-analysis-value">

                ${formatNumber(
                    evErrorPercent
                )}%

            </div>

        </div>


        <!-- ====================================
             總權重
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                最佳化後總權重
            </div>

            <div class="ai-analysis-value">

                ${formatNumber(
                    totalWeight
                )}

            </div>

        </div>


        <!-- ====================================
             AI 分析
        ==================================== -->

        <div class="ai-analysis-section">

            <div class="ai-analysis-label">
                AI 分析
            </div>

            <div class="ai-analysis-value">

                ${escapeHTML(
                    data.analysis ||
                    "沒有分析內容"
                )}

            </div>

        </div>


        ${warningsHTML}


        ${itemsHTML}


        ${recommendationHTML}


        <!-- ====================================
             重新分析
        ==================================== -->

        <button
            type="button"
            class="ai-analysis-refresh"
            id="ai-analysis-refresh"
        >
            ↻ 重新分析
        </button>

    `;


    /*
     * ========================================
     * 綁定重新分析
     * ========================================
     */

    const refreshButton =
        document.querySelector(
            "#ai-analysis-refresh"
        );


    if (refreshButton) {

        refreshButton.onclick =
            analyzeCurrentCase;

    }

}
    
</script>
