<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI 助手｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">


    <style>

        /* ========================================
           AI 頁面
        ======================================== */

        .ai-page {

            padding:
                45px 0 80px;

        }


        .ai-layout {

            display:
                grid;

            grid-template-columns:
                340px minmax(0, 1fr);

            gap:
                22px;

            margin-top:
                28px;

        }


        /* ========================================
           左側 AI 面板
        ======================================== */

        .ai-panel {

            padding:
                22px;

            background:
                var(--color-surface);

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-large);

        }


        .ai-panel-title {

            margin-bottom:
                6px;

            color:
                var(--color-text);

            font-size:
                1rem;

            font-weight:
                800;

        }


        .ai-panel-subtitle {

            margin-bottom:
                18px;

            color:
                var(--color-text-muted);

            font-size:
                0.75rem;

            line-height:
                1.6;

        }


        .ai-prompt {

            width:
                100%;

            min-height:
                170px;

            resize:
                vertical;

            padding:
                14px;

            box-sizing:
                border-box;

            color:
                var(--color-text);

            background:
                #0c1016;

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-medium);

            outline:
                none;

            font-family:
                inherit;

            font-size:
                0.82rem;

            line-height:
                1.6;

        }


        .ai-prompt:focus {

            border-color:
                var(--color-primary);

            box-shadow:
                0 0 0 2px
                rgba(
                    124,
                    92,
                    255,
                    0.12
                );

        }


        .ai-generate-button {

            width:
                100%;

            margin-top:
                12px;

        }


        /* ========================================
           結果區
        ======================================== */

        .ai-result {

            min-height:
                420px;

            padding:
                22px;

            background:
                var(--color-surface);

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-large);

        }


        .ai-empty {

            min-height:
                370px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                var(--color-text-muted);

            text-align:
                center;

            font-size:
                0.8rem;

        }


        /* ========================================
           結果標題
        ======================================== */

        .ai-result-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            padding-bottom:
                18px;

            margin-bottom:
                18px;

            border-bottom:
                1px solid
                var(--color-border);

        }


        .ai-result-name {

            margin:
                0;

            color:
                var(--color-text);

            font-size:
                1.3rem;

            font-weight:
                800;

        }


        .ai-result-count {

            margin-top:
                5px;

            color:
                var(--color-text-muted);

            font-size:
                0.7rem;

        }


        .ai-save-button {

            flex:
                0 0 auto;

        }


        /* ========================================
           物品列表
        ======================================== */

        .ai-items {

            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap:
                12px;

        }


        /* ========================================
           單一物品
        ======================================== */

        .ai-item {
            position: relative;
            padding: 15px;
            background: #0d1118;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-medium);
            overflow: hidden;
        }

        .ai-item-image {
            width: 100%;
            height: 180px;
        
            display: flex;
            align-items: center;
            justify-content: center;
        
            margin-bottom: 12px;
        
            background: #090d13;
        
            border-radius: 8px;
        
            overflow: hidden;
        }
        
        .ai-item-image img {
            width: 100%;
            height: 100%;
        
            object-fit: contain;
        
            display: block;
        
            transition: transform 0.2s ease;
        }

        .ai-item:hover .ai-item-image img {
            transform: scale(1.04);
        }
        
        .ai-item-image-empty {
            color: var(--color-text-muted);
            font-size: 0.7rem;
        }


        .ai-item:hover {

            border-color:
                var(--color-border-light);

        }


        .ai-item-top {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            margin-bottom:
                12px;

        }


        .ai-item-number {

            color:
                var(--color-text-muted);

            font-size:
                0.65rem;

            font-weight:
                700;

        }


        .ai-remove-button {

            padding:
                3px 7px;

            color:
                var(--color-text-muted);

            background:
                transparent;

            border:
                1px solid
                var(--color-border);

            border-radius:
                6px;

            cursor:
                pointer;

            font-size:
                0.62rem;

        }


        .ai-remove-button:hover {

            color:
                #ff8794;

            border-color:
                rgba(
                    255,
                    70,
                    90,
                    0.35
                );

        }


        /* ========================================
           欄位
        ======================================== */

        .ai-field {

            margin-top:
                10px;

        }


        .ai-field-label {

            display:
                block;

            margin-bottom:
                5px;

            color:
                var(--color-text-muted);

            font-size:
                0.62rem;

            font-weight:
                700;

        }


        .ai-input,
        .ai-select {

            width:
                100%;

            box-sizing:
                border-box;

            padding:
                8px 9px;

            color:
                var(--color-text);

            background:
                #090d13;

            border:
                1px solid
                var(--color-border);

            border-radius:
                7px;

            outline:
                none;

            font-family:
                inherit;

            font-size:
                0.72rem;

        }


        .ai-input:focus,
        .ai-select:focus {

            border-color:
                var(--color-primary);

            box-shadow:
                0 0 0 2px
                rgba(
                    124,
                    92,
                    255,
                    0.1
                );

        }


        .ai-field-row {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                8px;

        }


        /* ========================================
           新增物品
        ======================================== */

        .ai-add-item {

            margin-top:
                14px;

            width:
                100%;

            padding:
                11px;

            color:
                var(--color-text-muted);

            background:
                transparent;

            border:
                1px dashed
                var(--color-border);

            border-radius:
                var(--radius-medium);

            cursor:
                pointer;

            font-family:
                inherit;

            font-size:
                0.72rem;

            font-weight:
                700;

        }


        .ai-add-item:hover {

            color:
                var(--color-text);

            border-color:
                var(--color-primary);

        }


        /* ========================================
           Loading
        ======================================== */

        .ai-loading {

            min-height:
                370px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                12px;

            color:
                var(--color-text-muted);

            font-size:
                0.8rem;

        }


        .ai-spinner {

            width:
                28px;

            height:
                28px;

            border:
                3px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-top-color:
                var(--color-primary);

            border-radius:
                50%;

            animation:
                aiSpin
                0.8s
                linear
                infinite;

        }


        @keyframes aiSpin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* ========================================
           Error
        ======================================== */

        .ai-error {

            padding:
                16px;

            background:
                rgba(
                    255,
                    70,
                    90,
                    0.08
                );

            border:
                1px solid
                rgba(
                    255,
                    70,
                    90,
                    0.2
                );

            border-radius:
                var(--radius-medium);

            color:
                #ff8794;

            font-size:
                0.78rem;

            line-height:
                1.6;

        }


        /* ========================================
           成功
        ======================================== */

        .ai-success {

            padding:
                10px 12px;

            margin-bottom:
                12px;

            color:
                #8ee6b0;

            background:
                rgba(
                    70,
                    220,
                    130,
                    0.07
                );

            border:
                1px solid
                rgba(
                    70,
                    220,
                    130,
                    0.15
                );

            border-radius:
                7px;

            font-size:
                0.7rem;

        }


        /* ========================================
           手機
        ======================================== */

        @media (max-width: 800px) {

            .ai-layout {

                grid-template-columns:
                    1fr;

            }


            .ai-items {

                grid-template-columns:
                    1fr;

            }


            .ai-result-header {

                align-items:
                    stretch;

                flex-direction:
                    column;

            }


            .ai-save-button {

                width:
                    100%;

            }

        }

        .ai-item[data-color="White"] {
            border-color: rgba(220, 220, 220, 0.35);
            background: rgba(220, 220, 220, 0.035);
        }
        
        .ai-item[data-color="Light Blue"] {
            border-color: rgba(100, 180, 255, 0.4);
            background: rgba(100, 180, 255, 0.04);
        }
        
        .ai-item[data-color="Blue"] {
            border-color: rgba(70, 130, 255, 0.45);
            background: rgba(70, 130, 255, 0.045);
        }
        
        .ai-item[data-color="Purple"] {
            border-color: rgba(160, 90, 255, 0.45);
            background: rgba(160, 90, 255, 0.05);
        }
        
        .ai-item[data-color="Pink"] {
            border-color: rgba(255, 80, 180, 0.45);
            background: rgba(255, 80, 180, 0.05);
        }
        
        .ai-item[data-color="Red"] {
            border-color: rgba(255, 70, 70, 0.5);
            background: rgba(255, 70, 70, 0.055);
        }
        
        .ai-item[data-color="Gold"] {
            border-color: rgba(255, 200, 60, 0.5);
            background: rgba(255, 200, 60, 0.055);
        }
        
        .ai-item[data-color="Orange"] {
            border-color: rgba(255, 130, 40, 0.5);
            background: rgba(255, 130, 40, 0.055);
        }

    </style>

</head>


<body>


<main>

<section class="section-container ai-page">


    <div class="section-header">

        <span class="section-label">
            ELOCase
        </span>

        <h1>
            AI 助手
        </h1>

    </div>


    <div class="ai-layout">


        <!-- ========================================
             左側
        ======================================== -->

        <div class="ai-panel">

            <div class="ai-panel-title">
                生成收藏資料
            </div>


            <div class="ai-panel-subtitle">

                描述你想建立的收藏系列，
                AI 會搜尋資料並整理成 ELOCase 格式。
                生成後可以手動修改。

            </div>


            <textarea
                id="ai-prompt"
                class="ai-prompt"
                placeholder="例如：幫我建立一組 8 個 CS2 步槍收藏品，包含不同稀有度與磨損程度"
            ></textarea>

            <button
                id="ai-generate"
                class="button button-primary ai-generate-button"
                type="button"
            >
                ✦ 生成資料
            </button>

        </div>


        <!-- ========================================
             右側
        ======================================== -->

        <div
            class="ai-result"
            id="ai-result"
        >

            <div class="ai-empty">

                <div>

                    <div>
                        等待 AI 生成
                    </div>

                    <div style="margin-top:6px;">
                        生成後可以直接修改資料
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</main>


<script>


/* ========================================
   API
======================================== */

const AI_API_URL =
    "https://script.google.com/macros/s/AKfycbzfCdLdBUEv2tXaguqS0Fm9uf9PslygEYpL16eYrKVqEdoX9Z6AMpfU0Wd7xIUmI7FfDg/exec";


/* ========================================
   DOM
======================================== */

const promptInput =
    document.querySelector(
        "#ai-prompt"
    );


const generateButton =
    document.querySelector(
        "#ai-generate"
    );


const resultContainer =
    document.querySelector(
        "#ai-result"
    );


/* ========================================
   目前 AI 資料
======================================== */

let currentAIData = null;

// 防止「加入 Items」重複送出
let isSavingAIItems = false;


/* ========================================
   生成 AI
======================================== */

async function generateAI() {

    const prompt =
        promptInput.value.trim();


    if (!prompt) {

        promptInput.focus();

        return;

    }


    generateButton.disabled =
        true;

    generateButton.textContent =
        "AI 生成中...";


    resultContainer.innerHTML = `

        <div class="ai-loading">

            <div class="ai-spinner"></div>

            <div>
                AI 正在搜尋與整理資料...
            </div>

        </div>

    `;


    try {

        const response =
            await fetch(
                AI_API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "generateAI",

                            prompt:
                                prompt

                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "AI Result:",
            result
        );


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "AI 生成失敗"
            );

        }


        currentAIData =
            JSON.parse(
                JSON.stringify(
                    result.data
                )
            );


        renderAIResult(
            currentAIData
        );


    } catch (error) {

        console.error(
            "AI Error:",
            error
        );


        resultContainer.innerHTML = `

            <div class="ai-error">

                ${escapeHTML(
                    error.message ||
                    "AI 生成失敗"
                )}

            </div>

        `;

    } finally {

        generateButton.disabled =
            false;

        generateButton.textContent =
            "✦ 生成資料";

    }

}


/* ========================================
   顯示結果
======================================== */

function renderAIResult(data) {

    const items =
        Array.isArray(data.items)
            ? [...data.items]
            : [];


    items.sort(
        (a, b) =>
            Number(b.value || 0) -
            Number(a.value || 0)
    );


    resultContainer.innerHTML = `

        <div class="ai-result-header">

            <div style="flex:1;">

                <div class="ai-field">

                    <label class="ai-field-label">
                        收藏系列名稱
                    </label>

                    <input
                        type="text"
                        id="ai-collection-name"
                        class="ai-input"
                        value="${escapeAttribute(
                            data.name || ""
                        )}"
                    >

                </div>

            </div>


            <button
                type="button"
                class="button button-primary ai-save-button"
                id="save-ai-items"
            >
                加入 Items
            </button>

        </div>


        <div class="ai-result-count">
            ${items.length} 個物品
        </div>


        <div class="ai-items">

            ${
                items
                    .map(
                        (item, index) =>
                            renderAIItem(
                                item,
                                index
                            )
                    )
                    .join("")
            }

        </div>


        <button
            type="button"
            class="ai-add-item"
            id="ai-add-item"
        >
            ＋ 新增物品
        </button>

    `;


    /*
     * ========================================
     * 綁定事件
     * ========================================
     */

    bindResultEvents();

}


/* ========================================
   單一物品
======================================== */

function renderAIItem(
    item,
    index
) {

    const rarity =
        String(
            item.rarity || ""
        ).trim();


    const wear =
        String(
            item.wear || ""
        ).trim();


    const color =
        getRarityColorFrontend(
            rarity
        );


    return `
    
        <div
            class="ai-item"
            data-index="${index}"
            data-color="${escapeAttribute(color)}"
            data-image-url="${escapeAttribute(item.imageUrl || "")}"
        >
    
            <div class="ai-item-image">
    
                ${
                    item.imageUrl
                        ? `
                            <img
                                src="${escapeAttribute(item.imageUrl)}"
                                alt="${escapeAttribute(item.name || "物品圖片")}"
                                loading="lazy"
                                onerror="this.parentElement.innerHTML='<div class=&quot;ai-item-image-empty&quot;>圖片載入失敗</div>'"
                            >
                        `
                        : `
                            <div class="ai-item-image-empty">
                                尚無圖片
                            </div>
                        `
                }
    
            </div>
    
    
            <div class="ai-item-top">
    
                <span class="ai-item-number">
                    物品 ${index + 1}
                </span>
    
    
                <button
                    type="button"
                    class="ai-remove-button"
                    data-remove-index="${index}"
                >
                    移除
                </button>
    
            </div>
    
    
            <div class="ai-field">
    
                <label class="ai-field-label">
                    物品名稱
                </label>
    
                <input
                    type="text"
                    class="ai-input ai-edit-name"
                    value="${escapeAttribute(
                        item.name || ""
                    )}"
                >
    
            </div>
    
    
            <div class="ai-field-row">
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        稀有度
                    </label>
    
                    <select
                        class="ai-select ai-edit-rarity"
                    >
    
                        ${rarityOptions(
                            rarity
                        )}
    
                    </select>
    
                </div>
    
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        顏色
                    </label>
    
                    <input
                        type="text"
                        class="ai-input ai-edit-color"
                        value="${escapeAttribute(
                            color
                        )}"
                        readonly
                    >
    
                </div>
    
            </div>
    
    
            <div class="ai-field-row">
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        磨損
                    </label>
    
                    <select
                        class="ai-select ai-edit-wear"
                    >
    
                        ${wearOptions(
                            wear
                        )}
    
                    </select>
    
                </div>
    
    
                <div class="ai-field">
    
                    <label class="ai-field-label">
                        價值 USD
                    </label>
    
                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        class="ai-input ai-edit-value"
                        value="${Number(
                            item.value || 0
                        )}"
                    >
    
                </div>
    
            </div>
    
        </div>
    
    `;

}

function updateItemColor(card) {

    const raritySelect =
        card.querySelector(
            ".ai-edit-rarity"
        );

    const colorInput =
        card.querySelector(
            ".ai-edit-color"
        );


    if (
        !raritySelect ||
        !colorInput
    ) {

        return;

    }


    const color =
        getRarityColorFrontend(
            raritySelect.value
        );


    colorInput.value =
        color;


    card.dataset.color =
        color;

}


/* ========================================
   稀有度
======================================== */

function rarityOptions(
    current
) {

    const options = [

        "Consumer Grade",
        "Industrial Grade",
        "Mil-Spec",
        "Restricted",
        "Classified",
        "Covert",
        "Exceedingly Rare",
        "Contraband"

    ];


    return options
        .map(
            option => `

                <option
                    value="${escapeAttribute(option)}"
                    ${
                        option === current
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(option)}
                </option>

            `
        )
        .join("");

}


/* ========================================
   顏色
======================================== */

function colorOptions(
    current
) {

    const options = [

        "White",
        "Light Blue",
        "Blue",
        "Purple",
        "Pink",
        "Red",
        "Gold",
        "Orange"

    ];


    return options
        .map(
            option => `

                <option
                    value="${escapeAttribute(option)}"
                    ${
                        option === current
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(option)}
                </option>

            `
        )
        .join("");

}


/* ========================================
   Wear
======================================== */

function wearOptions(
    current
) {

    const options = [

        "Factory New (FN)",
        "Minimal Wear (MW)",
        "Field-Tested (FT)",
        "Well-Worn (WW)",
        "Battle-Scarred (BS)"

    ];


    return options
        .map(
            option => `

                <option
                    value="${escapeAttribute(option)}"
                    ${
                        option === current
                            ? "selected"
                            : ""
                    }
                >
                    ${escapeHTML(option)}
                </option>

            `
        )
        .join("");

}


/* ========================================
   綁定結果事件
======================================== */

function bindResultEvents() {

    const saveButton =
        document.querySelector(
            "#save-ai-items"
        );


    if (saveButton) {
        saveButton.onclick = saveAIItems;
    }


    const addButton =
        document.querySelector(
            "#ai-add-item"
        );


    if (addButton) {

        addButton.addEventListener(
            "click",
            addNewAIItem
        );

    }


    document
        .querySelectorAll(
            "[data-remove-index]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        removeAIItem(
                            Number(
                                button.dataset.removeIndex
                            )
                        );

                    }
                );

            }
        );


    /*
     * ========================================
     * Rarity 改變時自動更新 Color
     * ========================================
     */

    document
        .querySelectorAll(
            ".ai-edit-rarity"
        )
        .forEach(
            select => {

                select.addEventListener(
                    "change",
                    () => {

                        updateItemColor(
                            select.closest(
                                ".ai-item"
                            )
                        );

                    }
                );

            }
        );

}


/* ========================================
   新增物品
======================================== */

function addNewAIItem() {

    if (!currentAIData) {

        return;

    }


    if (
        currentAIData.items.length >= 12
    ) {

        alert(
            "最多只能有 12 個物品"
        );

        return;

    }


    currentAIData.items.push({
    
        name:
            "",
    
        rarity:
            "Mil-Spec",
    
        color:
            "Blue",
    
        wear:
            "Factory New (FN)",
    
        value:
            0,
    
        imageUrl:
            ""
    
    });


    renderAIResult(
        currentAIData
    );

}


/* ========================================
   移除物品
======================================== */

function removeAIItem(
    index
) {

    if (!currentAIData) {

        return;

    }


    if (
        index < 0 ||
        index >= currentAIData.items.length
    ) {

        return;

    }


    currentAIData.items.splice(
        index,
        1
    );


    renderAIResult(
        currentAIData
    );

}


/* ========================================
   讀取目前畫面上的修改
======================================== */

function collectEditedData() {

    if (!currentAIData) {

        return null;

    }


    const collectionName =
        document.querySelector(
            "#ai-collection-name"
        )?.value.trim();


    if (!collectionName) {

        throw new Error(
            "收藏系列名稱不能為空"
        );

    }


    const cards =
        document.querySelectorAll(
            ".ai-item"
        );


    if (
        cards.length === 0
    ) {

        throw new Error(
            "至少需要一個物品"
        );

    }


    const items = [];


    cards.forEach(
        card => {

            const name =
                card.querySelector(
                    ".ai-edit-name"
                ).value.trim();


            const rarity =
                card.querySelector(
                    ".ai-edit-rarity"
                ).value;


            const color =
                getRarityColorFrontend(
                    rarity
                );


            const wear =
                card.querySelector(
                    ".ai-edit-wear"
                ).value;


            const value =
                Number(
                    card.querySelector(
                        ".ai-edit-value"
                    ).value
                );


            if (!name) {

                throw new Error(
                    "有物品名稱尚未填寫"
                );

            }


            if (
                !Number.isFinite(value) ||
                value < 0
            ) {

                throw new Error(
                    `${name} 的價格無效`
                );

            }


            items.push({
            
                name:
                    name,
            
                rarity:
                    rarity,
            
                color:
                    color,
            
                wear:
                    wear,
            
                value:
                    value,
            
                imageUrl:
                    card.dataset.imageUrl || ""
            
            });

        }
    );


    return {

        name:
            collectionName,

        items:
            items

    };

}


/* ========================================
   加入 Items
======================================== */

async function saveAIItems() {

    // ========================================
    // 防止重複點擊 / 重複 POST
    // ========================================

    if (isSavingAIItems) {

        console.log(
            "⚠️ 已經正在加入 Items，忽略這次操作"
        );

        return;

    }

    isSavingAIItems = true;


    let data;


    try {

        data =
            collectEditedData();

    } catch (error) {

        isSavingAIItems = false;

        alert(
            error.message
        );

        return;

    }


    const token =
        localStorage.getItem(
            "elocaseSessionToken"
        );


    if (!token) {

        isSavingAIItems = false;

        alert(
            "登入狀態已失效，請重新登入"
        );

        return;

    }


    /*
     * ========================================
     * 價格高 → 低
     * ========================================
     */

    data.items.sort(
        (a, b) =>
            Number(b.value) -
            Number(a.value)
    );


    const button =
        document.querySelector(
            "#save-ai-items"
        );


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "加入中...";

    }


    try {

        const response =
            await fetch(
                AI_API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "saveAIItems",

                            token:
                                token,

                            collectionName:
                                data.name,

                            items:
                                data.items

                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "Save AI Items:",
            result
        );


        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "加入 Items 失敗"
            );

        }


        /*
         * ====================================
         * 成功
         * ====================================
         */

        if (button) {

            button.textContent =
                "✓ 已加入 Items";

            button.disabled =
                true;

        }


        alert(
            `成功加入 ${result.data.count} 個物品\n\n` +
            `箱子：${result.data.caseName}`
        );


        /*
         * ====================================
         * 成功後保持鎖定
         *
         * 防止再次建立同一個箱子
         * ====================================
         */

        // isSavingAIItems 保持 true


    } catch (error) {

        console.error(
            "Save AI Items Error:",
            error
        );


        alert(
            error.message ||
            "加入 Items 失敗"
        );


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "加入 Items";

        }


        /*
         * ====================================
         * 失敗 → 解除鎖定
         * 使用者可以重新嘗試
         * ====================================
         */

        isSavingAIItems = false;

    }

}


/* ========================================
   HTML Escape
======================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


/* ========================================
   Event
======================================== */

generateButton.addEventListener(
    "click",
    generateAI
);


promptInput.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key === "Enter"
        ) {

            generateAI();

        }

    }
);

function getRarityColorFrontend(
    rarity
) {

    const map = {

        "Consumer Grade":
            "White",

        "Industrial Grade":
            "Light Blue",

        "Mil-Spec":
            "Blue",

        "Restricted":
            "Purple",

        "Classified":
            "Pink",

        "Covert":
            "Red",

        "Exceedingly Rare":
            "Gold",

        "Contraband":
            "Orange"

    };


    return map[
        String(
            rarity || ""
        ).trim()
    ] || "White";

}
