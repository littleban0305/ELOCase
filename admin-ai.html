<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI 助手｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">

    <style>

        .ai-page {

            padding:
                45px 0 80px;

        }


        .ai-layout {

            display:
                grid;

            grid-template-columns:
                340px 1fr;

            gap:
                22px;

            margin-top:
                28px;

        }


        .ai-panel {

            padding:
                22px;

            background:
                var(--color-surface);

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-large);

        }


        .ai-panel-title {

            margin-bottom:
                6px;

            color:
                var(--color-text);

            font-size:
                1rem;

            font-weight:
                800;

        }


        .ai-panel-subtitle {

            margin-bottom:
                18px;

            color:
                var(--color-text-muted);

            font-size:
                0.75rem;

            line-height:
                1.6;

        }


        .ai-prompt {

            width:
                100%;

            min-height:
                170px;

            resize:
                vertical;

            padding:
                14px;

            box-sizing:
                border-box;

            color:
                var(--color-text);

            background:
                #0c1016;

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-medium);

            outline:
                none;

            font-family:
                inherit;

            font-size:
                0.82rem;

            line-height:
                1.6;

        }


        .ai-prompt:focus {

            border-color:
                var(--color-primary);

            box-shadow:
                0 0 0 2px
                rgba(124, 92, 255, 0.12);

        }


        .ai-generate-button {

            width:
                100%;

            margin-top:
                12px;

        }


        .ai-result {

            min-height:
                420px;

            padding:
                22px;

            background:
                var(--color-surface);

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-large);

        }


        .ai-empty {

            min-height:
                370px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                var(--color-text-muted);

            text-align:
                center;

            font-size:
                0.8rem;

        }


        .ai-result-header {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                15px;

            padding-bottom:
                18px;

            margin-bottom:
                18px;

            border-bottom:
                1px solid
                var(--color-border);

        }


        .ai-result-name {

            margin:
                0;

            color:
                var(--color-text);

            font-size:
                1.3rem;

            font-weight:
                800;

        }


        .ai-result-count {

            color:
                var(--color-text-muted);

            font-size:
                0.7rem;

        }


        .ai-items {

            display:
                grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap:
                10px;

        }


        .ai-item {

            padding:
                14px;

            background:
                #0d1118;

            border:
                1px solid
                var(--color-border);

            border-radius:
                var(--radius-medium);

        }


        .ai-item-name {

            margin-bottom:
                10px;

            color:
                var(--color-text);

            font-size:
                0.82rem;

            font-weight:
                700;

        }


        .ai-item-meta {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                6px;

        }


        .ai-tag {

            padding:
                4px 7px;

            border-radius:
                6px;

            background:
                rgba(255,255,255,0.05);

            color:
                var(--color-text-muted);

            font-size:
                0.62rem;

            font-weight:
                700;

        }


        .ai-value {

            margin-top:
                12px;

            color:
                var(--color-text);

            font-size:
                0.78rem;

            font-weight:
                800;

        }


        .ai-loading {

            min-height:
                370px;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                12px;

            color:
                var(--color-text-muted);

            font-size:
                0.8rem;

        }


        .ai-spinner {

            width:
                28px;

            height:
                28px;

            border:
                3px solid
                rgba(255,255,255,0.08);

            border-top-color:
                var(--color-primary);

            border-radius:
                50%;

            animation:
                aiSpin
                0.8s
                linear
                infinite;

        }


        @keyframes aiSpin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .ai-error {

            padding:
                16px;

            background:
                rgba(255, 70, 90, 0.08);

            border:
                1px solid
                rgba(255, 70, 90, 0.2);

            border-radius:
                var(--radius-medium);

            color:
                #ff8794;

            font-size:
                0.78rem;

            line-height:
                1.6;

        }


        @media (max-width: 800px) {

            .ai-layout {

                grid-template-columns:
                    1fr;

            }


            .ai-items {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>

    <main>

        <section class="section-container ai-page">

            <div class="section-header">

                <span class="section-label">
                    ELOCase
                </span>

                <h1>
                    AI 助手
                </h1>

            </div>


            <div class="ai-layout">


                <!-- ==============================
                     左側輸入
                ============================== -->

                <div class="ai-panel">

                    <div class="ai-panel-title">
                        生成收藏資料
                    </div>

                    <div class="ai-panel-subtitle">
                        描述你想建立的收藏系列，AI 會搜尋資料並整理成 ELOCase 格式。
                    </div>


                    <textarea
                        id="ai-prompt"
                        class="ai-prompt"
                        placeholder="例如：幫我建立一組 8 個物品的收藏系列..."
                    ></textarea>


                    <button
                        id="ai-generate"
                        class="button button-primary ai-generate-button"
                        type="button"
                    >
                        ✦ 生成資料
                    </button>

                </div>


                <!-- ==============================
                     右側結果
                ============================== -->

                <div
                    class="ai-result"
                    id="ai-result"
                >

                    <div class="ai-empty">

                        <div>

                            <div>
                                等待 AI 生成
                            </div>

                            <div style="margin-top:6px;">
                                生成後結果會顯示在這裡
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <script>

        /*
         * ========================================
         * Apps Script API
         * ========================================
         */

        const AI_API_URL =
            "https://script.google.com/macros/s/AKfycbzfCdLdBUEv2tXaguqS0Fm9uf9PslygEYpL16eYrKVqEdoX9Z6AMpfU0Wd7xIUmI7FfDg/exec";


        /*
         * ========================================
         * DOM
         * ========================================
         */

        const promptInput =
            document.querySelector(
                "#ai-prompt"
            );


        const generateButton =
            document.querySelector(
                "#ai-generate"
            );


        const resultContainer =
            document.querySelector(
                "#ai-result"
            );


        /*
         * ========================================
         * 生成 AI
         * ========================================
         */

        async function generateAI() {

            const prompt =
                promptInput.value.trim();


            if (!prompt) {

                promptInput.focus();

                return;

            }


            /*
             * Loading
             */

            generateButton.disabled =
                true;

            generateButton.textContent =
                "AI 生成中...";


            resultContainer.innerHTML = `

                <div class="ai-loading">

                    <div class="ai-spinner"></div>

                    <div>
                        AI 正在整理資料...
                    </div>

                </div>

            `;


            try {

                const response =
                    await fetch(
                        AI_API_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "text/plain;charset=utf-8"

                            },

                            body:
                                JSON.stringify({

                                    action:
                                        "generateAI",

                                    prompt:
                                        prompt

                                })

                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "AI Result:",
                    result
                );


                /*
                 * API 錯誤
                 */

                if (
                    !result.success
                ) {

                    throw new Error(
                        result.error ||
                        "AI 生成失敗"
                    );

                }


                /*
                 * 顯示結果
                 */

                renderAIResult(
                    result.data
                );


            } catch (error) {

                console.error(
                    "AI Error:",
                    error
                );


                resultContainer.innerHTML = `
                
                    <div class="ai-result-header">
                
                        <div>
                
                            <h2 class="ai-result-name">
                
                                ${escapeHTML(
                                    data.name ||
                                    "未命名收藏"
                                )}
                
                            </h2>
                
                        </div>
                
                
                        <div>
                
                            <button
                                type="button"
                                class="button button-primary"
                                id="save-ai-items"
                            >
                                加入 Items
                            </button>
                
                        </div>
                
                    </div>
                
                
                    <div class="ai-items">
                
                        ${
                            items
                                .map(
                                    item =>
                                        renderAIItem(item)
                                )
                                .join("")
                        }
                
                    </div>
                
                `;

            } finally {

                generateButton.disabled =
                    false;

                generateButton.textContent =
                    "✦ 生成資料";

            }

        }


        /*
         * ========================================
         * 顯示結果
         * ========================================
         */

        function renderAIResult(
            data
        ) {

            const items =
                Array.isArray(
                    data.items
                )
                    ? data.items
                    : [];


            resultContainer.innerHTML = `

                <div class="ai-result-header">

                    <div>

                        <h2
                            class="ai-result-name"
                        >
                            ${escapeHTML(
                                data.name ||
                                "未命名收藏"
                            )}
                        </h2>

                    </div>

                    <div class="ai-result-count">
                        ${items.length} 個物品
                    </div>

                </div>


                <div class="ai-items">

                    ${items
                        .map(
                            item =>
                                renderAIItem(
                                    item
                                )
                        )
                        .join("")
                    }

                </div>

            `;

            const saveButton =
                document.querySelector(
                    "#save-ai-items"
                );
            
            
            if (saveButton) {
            
                saveButton.addEventListener(
                    "click",
                    () => {
            
                        saveAIItems(
                            data
                        );
            
                    }
                );
            
            }

        }


        /*
         * ========================================
         * 單一物品
         * ========================================
         */

        function renderAIItem(
            item
        ) {

            return `

                <div class="ai-item">

                    <div class="ai-item-name">

                        ${escapeHTML(
                            item.name ||
                            "未命名物品"
                        )}

                    </div>


                    <div class="ai-item-meta">

                        <span class="ai-tag">

                            ${escapeHTML(
                                item.rarity ||
                                "-"
                            )}

                        </span>


                        <span class="ai-tag">

                            ${escapeHTML(
                                item.color ||
                                "-"
                            )}

                        </span>


                        <span class="ai-tag">

                            ${escapeHTML(
                                item.wear ||
                                "-"
                            )}

                        </span>

                    </div>


                    <div class="ai-value">

                        $${Number(
                            item.value || 0
                        ).toLocaleString()}

                    </div>

                </div>

            `;

        }


        /*
         * ========================================
         * HTML Escape
         * ========================================
         */

        function escapeHTML(
            value
        ) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /*
         * ========================================
         * Event
         * ========================================
         */

        generateButton.addEventListener(
            "click",
            generateAI
        );


        promptInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.ctrlKey &&
                    event.key === "Enter"
                ) {

                    generateAI();

                }

            }
        );

        async function saveAIItems(
            data
        ) {
        
            const token =
                localStorage.getItem(
                    "sessionToken"
                );
        
        
            if (!token) {
        
                alert(
                    "登入狀態已失效，請重新登入"
                );
        
                return;
        
            }
        
        
            const button =
                document.querySelector(
                    "#save-ai-items"
                );
        
        
            if (button) {
        
                button.disabled =
                    true;
        
                button.textContent =
                    "加入中...";
        
            }
        
        
            try {
        
                const response =
                    await fetch(
                        AI_API_URL,
                        {
        
                            method:
                                "POST",
        
                            headers: {
        
                                "Content-Type":
                                    "text/plain;charset=utf-8"
        
                            },
        
                            body:
                                JSON.stringify({
        
                                    action:
                                        "saveAIItems",
        
                                    token:
                                        token,
        
                                    collectionName:
                                        data.name,
        
                                    items:
                                        data.items
        
                                })
        
                        }
                    );
        
        
                const result =
                    await response.json();
        
        
                console.log(
                    "Save AI Items:",
                    result
                );
        
        
                if (
                    !result.success
                ) {
        
                    throw new Error(
                        result.error ||
                        "加入 Items 失敗"
                    );
        
                }
        
        
                if (button) {
        
                    button.textContent =
                        "✓ 已加入 Items";
        
                    button.disabled =
                        true;
        
                }
        
        
                alert(
                    `成功加入 ${result.data.count} 個物品`
                );
        
        
            } catch (error) {
        
                console.error(
                    error
                );
        
        
                alert(
                    error.message
                );
        
        
                if (button) {
        
                    button.disabled =
                        false;
        
                    button.textContent =
                        "加入 Items";
        
                }
        
            }
        
        }

    </script>

</body>

</html>
