<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>箱子｜ELOCase</title>


    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/case.css"
    >

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header
        class="navbar"
        id="navbar"
    ></header>



    <!-- ========================================
         主要內容
    ======================================== -->

    <main id="case-page">


        <section class="case-page">

            <div class="section-container">


                <!-- ====================================
                     返回
                ==================================== -->

                <a
                    href="cases.html"
                    class="case-back"
                >
                    ← 返回箱子
                </a>



                <!-- ====================================
                     開箱 Hero
                ==================================== -->

                <section class="case-hero">


                    <div class="case-preview">


                        <!-- =================================
                             箱子圖片 + 資訊
                        ================================= -->

                        <div class="case-hero-top">
                        
                            <!-- 箱子圖片 -->
                        
                            <div
                                id="case-image"
                                class="case-hero-image"
                            >
                                <span>
                                    ELOCase
                                </span>
                            </div>
                        
                        
                            <!-- 箱子名稱 -->
                        
                            <div class="case-hero-info">
                        
                                <div
                                    id="case-game"
                                    class="case-detail-game"
                                >
                                    載入中...
                                </div>
                        
                                <h1 id="case-name">
                                    載入中...
                                </h1>
                        
                            </div>
                        
                        </div>

                        <!-- =================================
                             ELOCase 真實開箱動畫
                        ================================= -->
                        
                        <div
                            id="case-opening-animation"
                            class="case-opening-animation"
                        >
                        
                            <div class="case-opening-scene">
                            
                                <!-- 箱子 -->
                                <img
                                    src="assets/case/elocase-box.png"
                                    class="case-opening-box"
                                    alt=""
                                >
                            
                                <!-- ELOCase 專用鑰匙 -->
                                <img
                                    src="assets/case/elocase-key.png"
                                    class="case-opening-key"
                                    alt=""
                                >
                            
                                <!-- 黃光 -->
                                <div
                                    class="case-opening-light"
                                ></div>
                            
                            </div>
                        
                        </div>

                        <!-- =================================
                             開箱預覽
                        ================================= -->

                        <div
                            id="case-preview-container"
                            class="case-preview-container"
                        >
                        
                            <div class="case-preview-wrapper">
    
    
                                <!-- 中央指示線 -->
    
                                <div
                                    class="case-preview-pointer"
                                ></div>
    
    
                                <!-- 物品軌道 -->
    
                                <div
                                    id="case-preview-track"
                                    class="case-preview-track"
                                >
    
                                    <!-- JS 自動產生 -->
    
                                </div>
    
    
                            </div>

                        </div>
                        
                        <!-- =================================
                             價格 + 開箱
                        ================================= -->
                        
                        <div class="case-open-actions">
                        
                            <div
                                id="case-price"
                                class="case-detail-price"
                            >
                                $0
                            </div>
                        
                            <button
                                type="button"
                                id="open-case-button"
                                class="
                                    button
                                    button-primary
                                    button-large
                                "
                            >
                                開啟箱子
                            </button>
                        
                        </div>

                        <!-- =================================
                             開箱狀態
                        ================================= -->

                        <div class="case-hero-actions">


                            <div
                                id="case-preview-status"
                                class="case-preview-status"
                            >
                            </div>


                        </div>


                    </div>

                </section>



                <!-- ====================================
                     箱子內容物
                ==================================== -->

                <section class="case-contents">


                    <div class="section-header">


                        <span class="section-label">
                            內容物
                        </span>


                        <h2>
                            箱子內容物
                        </h2>


                    </div>


                    <div
                        id="case-items"
                        class="case-items-grid"
                    >


                        <div class="case-items-loading">
                            載入中...
                        </div>


                    </div>


                </section>


            </div>

        </section>


    </main>



    <!-- ========================================
         Footer
    ======================================== -->

    <footer class="footer">


        <div class="footer-container">


            <div class="footer-brand">
                ELOCase
            </div>


            <p>
                CS2 虛擬物品平台
            </p>


            <span>
                © 2026 ELOCase
            </span>


        </div>


    </footer>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/loading.js"></script>
    
    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/case.js"></script>

    <script src="js/navbar.js"></script>

    <script src="js/cases.js"></script>



    <script>

        /* ========================================
           初始化玩家 Navbar
        ======================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                try {

                    const user =
                        await verifySession();


                    updateLoginUI(
                        user
                    );


                } catch (error) {

                    console.error(
                        "玩家資料載入失敗：",
                        error
                    );

                }

            }
        );

    </script>


</body>

</html>
