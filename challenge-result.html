<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Challenge Result｜ELOCase
</title>


<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/challenge-theme.css">
<link rel="stylesheet" href="css/challenge-result.css">
<link rel="stylesheet" href="css/challenge-loading.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/mobile.css">


</head>


<body class="challenge-mode">


<!-- ========================================
     Challenge Navbar
======================================== -->

<header class="challenge-navbar">


<div class="challenge-navbar-container">


<a
href="challenge.html"
class="challenge-brand"
>

<span>
ELOCase
</span>

<strong>
Challenge Mode
</strong>

</a>



<div class="challenge-navbar-status">


<div class="challenge-user-box">


<div class="challenge-box-title">
我的 ELOCoin
</div>


<div
id="navbar-my-coin"
class="challenge-box-value"
>
0
</div>


</div>



<div class="challenge-user-box">


<div class="challenge-box-title">
我的物品價值
</div>


<div
id="navbar-my-value"
class="challenge-box-value"
>
0
</div>


</div>



<div class="challenge-user-box opponent">


<div class="challenge-box-title">
對手 ELOCoin
</div>


<div
id="navbar-opponent-coin"
class="challenge-box-value"
>
0
</div>


</div>



<div class="challenge-user-box opponent">


<div class="challenge-box-title">
對手物品價值
</div>


<div
id="navbar-opponent-value"
class="challenge-box-value"
>
0
</div>


</div>


</div>


</div>


</header>





<!-- ========================================
     Main
======================================== -->

<main class="challenge-result-page">


<div class="section-container">



<div class="section-header">


<span class="section-label">
Challenge Result
</span>


<h1 id="result-title">
挑戰結果
</h1>


</div>





<!-- ========================================
     Result Card
======================================== -->

<section class="result-card">


<div class="challenge-result-title">

🏆 挑戰結束 🏆

</div>



<div
id="winner-text"
class="winner-text"
>

計算中...

</div>





<!-- ========================================
     VS Result
======================================== -->

<div class="vs-result">


<div class="result-player player-a">


<h2 id="result-my-name">
玩家
</h2>


<div class="result-value">

最終價值

<strong id="result-my-value">
0
</strong>

</div>


<div>

物品價值：

<span id="player-a-items">
0
</span>

</div>


<div>

ELOCoin：

<span id="player-a-coin">
0
</span>

</div>


</div>





<div class="result-vs">

VS

</div>





<div class="result-player player-b">


<h2 id="result-opponent-name">
對手
</h2>


<div class="result-value">

最終價值

<strong id="result-opponent-value">
0
</strong>

</div>


<div>

物品價值：

<span id="player-b-items">
0
</span>

</div>


<div>

ELOCoin：

<span id="player-b-coin">
0
</span>

</div>


</div>


</div>





<!-- ========================================
     Challenge Record
======================================== -->

<section class="challenge-result-record">


<div class="challenge-result-record-title">

Challenge Record

</div>



<div class="challenge-result-record-grid">


<div class="challenge-result-record-item">


<span>
Challenge Code
</span>


<strong id="result-challenge-code">
-
</strong>


</div>



<div class="challenge-result-record-item">


<span>
Challenge 狀態
</span>


<strong id="result-challenge-status">
已完成
</strong>


</div>



<div class="challenge-result-record-item">


<span>
初始 Challenge EC
</span>


<strong id="result-initial-ec">
0
</strong>


</div>



<div class="challenge-result-record-item">


<span>
建立時間
</span>


<strong id="result-created-at">
-
</strong>


</div>



<div class="challenge-result-record-item">


<span>
最後更新
</span>


<strong id="result-updated-at">
-
</strong>


</div>


</div>


</section>





<!-- ========================================
     Back Button
======================================== -->

<button
id="back-challenge-button"
class="button button-primary"
>

返回 Challenge

</button>


</section>


</div>


</main>





<!-- ========================================
     Footer
======================================== -->

<footer class="footer">


<div class="footer-container">


<div class="footer-brand">
ELOCase
</div>


<p>
CS2 虛擬物品平台
</p>


<span>
© 2026 ELOCase
</span>


</div>


</footer>

     Scripts
======================================== -->

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/challenge-result.js"></script>


</body>

</html>
