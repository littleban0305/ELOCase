<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>箱子管理｜ELOCase</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/admin-cases.css"
    >

    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/mobile.css">

</head>


<body>


<header class="navbar">

    <div class="navbar-container">

        <a
            href="index.html"
            class="brand"
        >
            ELOCase
        </a>


        <div class="admin-navbar-title">

            管理後台

        </div>


        <a
            href="index.html"
            class="button button-secondary"
        >
            返回網站
        </a>

    </div>

</header>



<main class="admin-page">


    <div class="admin-container">


        <!-- ====================================
             Header
        ==================================== -->

        <section class="admin-header">

            <div>

                <span class="section-label">
                    ADMIN
                </span>

                <h1>
                    箱子管理
                </h1>

                <p>
                    管理 ELOCase 的開箱箱子
                </p>

            </div>


            <button
                id="create-case-button"
                class="button button-primary"
                type="button"
            >
                ＋ 新增箱子
            </button>

        </section>



        <!-- ====================================
             Message
        ==================================== -->

        <div
            id="admin-message"
            class="admin-message"
        ></div>



        <!-- ====================================
             Loading
        ==================================== -->

        <div
            id="cases-loading"
            class="cases-loading"
        >
            載入箱子中...
        </div>



        <!-- ====================================
             Cases
        ==================================== -->

        <section
            id="cases-container"
            class="cases-container"
        ></section>


    </div>

</main>



<!-- =========================================
     Case Modal
========================================= -->

<div
    id="case-modal"
    class="modal-overlay"
>

    <div class="case-modal">


        <div class="case-modal-header">

            <div>

                <span
                    id="modal-label"
                    class="section-label"
                >
                    新增箱子
                </span>

                <h2
                    id="modal-title"
                >
                    建立箱子
                </h2>

            </div>


            <button
                id="close-modal-button"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>



        <form id="case-form">


            <input
                type="hidden"
                id="caseId"
            >


            <!-- 名稱 -->

            <div class="form-group">

                <label for="case-name">
                    箱子名稱
                </label>

                <input
                    id="case-name"
                    type="text"
                    placeholder="例如：系列收集箱"
                    required
                >

            </div>



            <!-- 遊戲 -->

            <div class="form-group">

                <label for="case-game">
                    遊戲
                </label>

                <input
                    id="case-game"
                    type="text"
                    placeholder="例如：CS2"
                    required
                >

            </div>



            <!-- 價格 -->

            <div class="form-group">

                <label for="case-price">
                    箱子價格
                </label>

                <input
                    id="case-price"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="40"
                    required
                >

            </div>



            <!-- 圖片 URL -->

            <div class="form-group">

                <label for="case-image-url">
                    箱子圖片 URL
                </label>

                <input
                    id="case-image-url"
                    type="url"
                    placeholder="https://..."
                >

                <small>
                    貼上箱子圖片的網址即可
                </small>

            </div>



            <!-- 圖片預覽 -->

            <div
                id="case-image-preview"
                class="case-image-preview"
            >

                <span>
                    尚未設定圖片
                </span>

            </div>



            <!-- 箱子物品 -->

            <div class="case-items-editor-section">

                <div class="case-items-editor-header">

                    <div>
                        <label>箱子內容物</label>
                        <small>新增這個箱子可以掉落的物品，最多 12 個。</small>
                    </div>

                    <span id="case-items-count" class="case-items-count">0 / 12</span>

                </div>

                <div
                    id="case-items-editor"
                    class="case-items-editor"
                ></div>

                <button
                    id="add-case-item-button"
                    type="button"
                    class="button button-secondary case-add-item-button"
                >
                    ＋ 新增物品
                </button>

            </div>


            <!-- 狀態 -->

            <div class="form-group">

                <label for="case-status">
                    狀態
                </label>

                <select id="case-status">

                    <option value="active">
                        啟用
                    </option>

                    <option value="inactive">
                        停用
                    </option>

                </select>

            </div>



            <!-- Buttons -->

            <div class="modal-actions">

                <button
                    id="cancel-modal-button"
                    type="button"
                    class="button button-secondary"
                >
                    取消
                </button>


                <button
                    id="save-case-button"
                    type="submit"
                    class="button button-primary"
                >
                    儲存箱子
                </button>

            </div>


        </form>


    </div>

</div>



<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/admin-cases.js"></script>


</body>

</html>
