<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>箱子管理｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin-cases.css">

</head>


<body>


<header class="navbar">

    <div class="navbar-container">

        <a
            href="index.html"
            class="brand"
        >
            ELOCase
        </a>


        <div class="admin-navbar-title">

            箱子管理

        </div>


        <a
            href="index.html"
            class="button button-secondary"
        >
            返回首頁
        </a>

    </div>

</header>



<main>

    <section class="admin-cases-page">

        <div class="container">


            <!-- ====================================
                 頁面標題
            ==================================== -->

            <div class="admin-page-header">

                <div>

                    <span class="section-label">
                        ADMIN
                    </span>

                    <h1>
                        箱子管理
                    </h1>

                    <p>
                        管理 ELOCase 平台上的所有箱子。
                    </p>

                </div>


                <button
                    id="create-case-button"
                    class="button button-primary"
                >
                    ＋ 新增箱子
                </button>

            </div>



            <!-- ====================================
                 統計
            ==================================== -->

            <div class="admin-stats">

                <div class="admin-stat-card">

                    <span>
                        全部箱子
                    </span>

                    <strong id="total-case-count">
                        0
                    </strong>

                </div>


                <div class="admin-stat-card">

                    <span>
                        啟用中
                    </span>

                    <strong id="active-case-count">
                        0
                    </strong>

                </div>


                <div class="admin-stat-card">

                    <span>
                        已停用
                    </span>

                    <strong id="inactive-case-count">
                        0
                    </strong>

                </div>

            </div>



            <!-- ====================================
                 箱子列表
            ==================================== -->

            <section class="admin-panel">

                <div class="admin-panel-header">

                    <div>

                        <h2>
                            箱子列表
                        </h2>

                        <span>
                            管理目前 Cases Sheet 中的資料
                        </span>

                    </div>


                    <button
                        id="refresh-cases-button"
                        class="button button-secondary"
                    >
                        重新整理
                    </button>

                </div>


                <div
                    id="case-table-wrapper"
                    class="case-table-wrapper"
                >

                    <div class="admin-loading">

                        載入箱子資料中...

                    </div>

                </div>

            </section>


        </div>

    </section>

</main>



<!-- ========================================
     Modal
======================================== -->

<div
    id="case-modal"
    class="case-modal"
>

    <div class="case-modal-overlay"></div>


    <div class="case-modal-card">


        <div class="case-modal-header">

            <div>

                <span
                    id="modal-mode-label"
                    class="section-label"
                >
                    新增箱子
                </span>

                <h2 id="modal-title">
                    新增箱子
                </h2>

            </div>


            <button
                id="close-modal-button"
                class="modal-close-button"
                type="button"
            >
                ×
            </button>

        </div>



        <form id="case-form">


            <input
                type="hidden"
                id="caseId"
            >


            <div class="form-grid">


                <div class="form-group">

                    <label for="case-name">
                        箱子名稱
                    </label>

                    <input
                        id="case-name"
                        type="text"
                        placeholder="例如：系列收集箱"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="case-game">
                        遊戲
                    </label>

                    <input
                        id="case-game"
                        type="text"
                        placeholder="CS2"
                        value="CS2"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="case-price">
                        箱子價格
                    </label>

                    <input
                        id="case-price"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="40"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="case-status">
                        狀態
                    </label>

                    <select id="case-status">

                        <option value="active">
                            啟用
                        </option>

                        <option value="inactive">
                            停用
                        </option>

                    </select>

                </div>


            </div>



            <div class="form-group">

                <label for="case-image-url">
                    箱子圖片 URL
                </label>

                <input
                    id="case-image-url"
                    type="url"
                    placeholder="https://..."
                >

                <div
                    id="image-preview"
                    class="image-preview"
                ></div>

            </div>



            <div class="form-group">

                <label for="case-description">
                    箱子描述
                </label>

                <textarea
                    id="case-description"
                    rows="5"
                    placeholder="輸入箱子描述..."
                ></textarea>

            </div>



            <div
                id="case-form-message"
                class="case-form-message"
            ></div>



            <div class="case-modal-actions">

                <button
                    type="button"
                    id="cancel-case-button"
                    class="button button-secondary"
                >
                    取消
                </button>


                <button
                    type="submit"
                    id="save-case-button"
                    class="button button-primary"
                >
                    儲存箱子
                </button>

            </div>


        </form>

    </div>

</div>



<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-cases.js"></script>

</body>

</html>
