<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <!-- 導覽列 -->
    <header class="navbar">
        <div class="navbar-container">

            <a href="index.html" class="brand">
                ELOCase
            </a>

            <nav class="nav-links">
                <a href="index.html" class="nav-link active">首頁</a>
                <a href="cases.html" class="nav-link">開箱</a>
                <a href="inventory.html" class="nav-link">我的物品</a>
                <a href="profile.html" class="nav-link">個人資料</a>
            </nav>

            <div class="navbar-actions">
                <div class="balance">
                    <span class="balance-label">ELOCoin</span>
                    <span class="balance-value">0</span>
                </div>

                <a href="login.html" class="button button-primary">
                    登入
                </a>
            </div>

        </div>
    </header>


    <!-- 主要內容 -->
    <main>

        <!-- 首頁主視覺 -->
        <section class="hero">

            <div class="hero-container">

                <div class="hero-content">

                    <span class="hero-label">
                        CS2 虛擬物品平台
                    </span>

                    <h1>
                        探索你的下一件收藏
                    </h1>

                    <p>
                        開啟箱子，收集 CS2 武器，
                        建立屬於自己的物品收藏。
                    </p>

                    <div class="hero-actions">

                        <a href="cases.html" class="button button-primary button-large">
                            查看箱子
                        </a>

                        <a href="inventory.html" class="button button-secondary button-large">
                            查看物品
                        </a>

                    </div>

                </div>

            </div>

        </section>


        <!-- 功能區 -->
        <section class="features">

            <div class="section-container">

                <div class="section-header">
                    <span class="section-label">平台功能</span>

                    <h2>
                        ELOCase
                    </h2>

                    <p>
                        從開箱開始，逐步建立你的物品收藏。
                    </p>
                </div>


                <div class="feature-grid">

                    <a href="cases.html" class="feature-card">

                        <div class="feature-icon">
                            開
                        </div>

                        <div class="feature-content">

                            <h3>開箱</h3>

                            <p>
                                開啟不同箱子，獲得隨機 CS2 物品。
                            </p>

                        </div>

                    </a>


                    <div class="feature-card feature-disabled">

                        <div class="feature-icon">
                            升
                        </div>

                        <div class="feature-content">

                            <h3>升級</h3>

                            <p>
                                升級功能即將推出。
                            </p>

                        </div>

                    </div>


                    <div class="feature-card feature-disabled">

                        <div class="feature-icon">
                            交
                        </div>

                        <div class="feature-content">

                            <h3>交易</h3>

                            <p>
                                與其他玩家交換物品。
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- 最近物品 -->
        <section class="recent-items">

            <div class="section-container">

                <div class="section-header section-header-row">

                    <div>
                        <span class="section-label">收藏</span>

                        <h2>
                            最近物品
                        </h2>
                    </div>

                    <a href="inventory.html" class="text-link">
                        查看全部
                    </a>

                </div>


                <div class="empty-state">

                    <div class="empty-state-icon">
                        —
                    </div>

                    <h3>
                        尚未有物品
                    </h3>

                    <p>
                        開啟第一個箱子後，你的物品會顯示在這裡。
                    </p>

                    <a href="cases.html" class="button button-secondary">
                        前往開箱
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- 頁尾 -->
    <footer class="footer">

        <div class="footer-container">

            <div class="footer-brand">
                ELOCase
            </div>

            <p>
                CS2 虛擬物品平台
            </p>

            <span>
                © 2026 ELOCase
            </span>

        </div>

    </footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>

<script>
    async function loadTestPlayer() {
        try {
            const player = await getPlayerByToken("TEST_ELO666");

            updateBalance(player.eloCoin);

            console.log("玩家資料：", player);

        } catch (error) {
            console.error("無法取得玩家資料：", error);
        }
    }

    loadTestPlayer();
</script>

</body>
</html>
