<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>


<title>
Challenge Room｜ELOCase Challenge Mode
</title>



<link
rel="stylesheet"
href="css/global.css"
>

<link
rel="stylesheet"
href="css/components.css"
>

<link
rel="stylesheet"
href="css/challenge-room.css"
>


</head>


<body>


<!-- ========================================
     Challenge Navbar
======================================== -->


<header class="challenge-navbar">


<div class="challenge-navbar-container">


<a
href="challenge.html"
class="challenge-brand"
>


<span class="challenge-brand-main">
ELOCase
</span>


<span class="challenge-brand-mode">
Challenge Mode
</span>


</a>





<nav class="challenge-nav-links">


<a
href="challenge.html"
class="challenge-nav-link active"
>
挑戰
</a>


<a
href="#"
class="challenge-nav-link"
>
紀錄
</a>


</nav>







<div class="challenge-navbar-actions">



<div class="challenge-ec-display">


<span>
⚡
</span>


<strong id="challenge-navbar-ec">
0
</strong>


<span>
EC
</span>


</div>







<div class="player-menu">



<button
class="player-menu-button"
id="player-menu-button"
>


<span class="player-avatar">
◉
</span>


<span
class="player-menu-name"
id="navbar-player-name"
>
登入
</span>


<span class="player-menu-arrow">
▾
</span>


</button>




<div
class="player-menu-dropdown"
>


<a
href="profile.html"
class="player-menu-item"
>
個人資料
</a>



<button
class="player-menu-item player-menu-logout"
>
登出
</button>


</div>



</div>



</div>



</div>


</header>








<main>


<section
class="challenge-room-page"
>


<div
class="section-container"
>





<!-- ========================================
     Header
======================================== -->


<div class="section-header">


<span class="section-label challenge-label">

Challenge Mode

</span>



<h1>

挑戰房間

</h1>



<p>

與另一位玩家競爭最終價值。

</p>



</div>










<!-- ========================================
     Room Card
======================================== -->


<div class="room-card">





<!-- Challenge Code -->


<div class="challenge-code-section">


<h3>
挑戰代碼
</h3>



<div class="challenge-code-box">


<span
id="challenge-code"
>
-
</span>



<button
id="copy-code-button"
class="button button-secondary"
>
複製
</button>



</div>



<div
id="copy-message"
class="copy-message"
>

</div>



</div>








<!-- Status -->


<div class="room-status">


<span>
狀態：
</span>



<strong
id="challenge-status"
>
-
</strong>


</div>









<!-- ========================================
     VS
======================================== -->

<div class="vs-area">





<!-- Player A -->


<div
class="room-player"
>


<div class="player-side-title">

PLAYER A

</div>



<h2
id="player-a-name"
>
Player A
</h2>





<div class="ec-box">


<span>
Challenge EC
</span>



<strong
id="player-a-ec"
>
-
</strong>



</div>






<div class="value-box">


目前總價值


<strong
id="player-a-value"
>
0
</strong>



</div>







<button
id="player-a-case-button"
class="button button-primary"
>

選擇箱子

</button>







<div class="player-inventory">


<h3>
物品庫
</h3>



<div
id="player-a-items"
class="challenge-items"
>


<div class="empty-item">

尚無物品

</div>



</div>



</div>




</div>









<!-- VS -->


<div class="vs-text">

VS

</div>








<!-- Player B -->


<div
class="room-player"
>


<div class="player-side-title">

PLAYER B

</div>




<h2
id="player-b-name"
>
Player B
</h2>






<div class="ec-box">


<span>
Challenge EC
</span>



<strong
id="player-b-ec"
>
-
</strong>



</div>






<div class="value-box">


目前總價值


<strong
id="player-b-value"
>
0
</strong>



</div>








<button
id="player-b-case-button"
class="button button-primary"
>

選擇箱子

</button>








<div class="player-inventory">


<h3>
物品庫
</h3>



<div
id="player-b-items"
class="challenge-items"
>


<div class="empty-item">

尚無物品

</div>



</div>



</div>





</div>







</div>








</div>



</div>


</section>


</main>







<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/player.js"></script>

<script src="js/challenge-room.js"></script>



</body>


</html>
