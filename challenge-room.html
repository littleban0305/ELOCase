<header class="navbar">

<div class="balance">

$

<span class="balance-value">
0

</div>



<div class="player-menu">


<button
class="player-menu-button"
id="player-menu-button"
>


<span class="player-avatar">
◉

class="player-menu-name"
id="navbar-player-name"
>

<div
class="player-menu-dropdown"
>


<a
href="profile.html"
class="player-menu-item"
>

href="inventory.html"
class="player-menu-item"
>

class="player-menu-item player-menu-logout"
>
登出
</button>


</div>


</div>



</div>



</div>


</header>







<main>


<section class="challenge-room-page">


<div class="section-container">



<div class="section-header">


<span class="section-label">
挑戰模式
</span>


<h1>
挑戰房間
</h1>


<p>
查看雙方挑戰進度與物品收藏。
</p>


</div>







<div class="room-card">



<div class="challenge-code-section">


<h3>
挑戰代碼
</h3>



<div class="challenge-code-box">


<span id="challenge-code">
-
</span>


<button
id="copy-code-button"
class="button button-secondary"
>

複製

</button>


</div>



<div
id="copy-message"
class="copy-message"
>

</div>


</div>






<div class="room-status">

狀態：
<span id="challenge-status">
-
</span>


</div>

<div class="vs-area">

<!-- =========================
     Player A
========================= -->


<div class="room-player">


<h2>

<span id="player-a-name">
Player A
</span>

</h2>



<div class="ec-box">

EC

<strong id="player-a-ec">
-
</strong>


</div>



<div>
物品價值：
<span id="player-a-value">
0
</span>
</div>





<div class="player-inventory">


<h3>
物品庫
</h3>


<div
id="player-a-items"
class="challenge-items"
>


</div>


</div>



</div>

<div class="vs-text">

VS

</div>


<!-- =========================
     Player B
========================= -->


<div class="room-player">


<h2>

<span id="player-b-name">
Player B
</span>

</h2>



<div class="ec-box">

EC

<strong id="player-b-ec">
-
</strong>


</div>



<div>
物品價值：
<span id="player-b-value">
0
</span>
</div>





<div class="player-inventory">


<h3>
物品庫
</h3>


<div
id="player-b-items"
class="challenge-items"
>


</div>


</div>



</div>






</div>






</div>



</div>


</section>


</main>
