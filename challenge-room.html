<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Challenge Room｜ELOCase
</title>


<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/challenge-room.css">


</head>


<body class="challenge-mode">


<header class="challenge-navbar">


<div class="challenge-navbar-container">


<a
href="challenge.html"
class="challenge-brand"
>

<span>
ELOCase
</span>

<strong>
Challenge Mode
</strong>

</a>




<div class="challenge-navbar-status">



<div class="challenge-user-box">


<div class="challenge-box-title">
我的 ELOCoin
</div>


<div
id="navbar-my-coin"
class="challenge-box-value"
>
0
</div>


</div>





<div class="challenge-user-box">


<div class="challenge-box-title">
我的物品價值
</div>


<div
id="navbar-my-value"
class="challenge-box-value"
>
0
</div>


</div>







<div class="challenge-user-box opponent">


<div class="challenge-box-title">
對手 ELOCoin
</div>


<div
id="navbar-opponent-coin"
class="challenge-box-value"
>
0
</div>


</div>





<div class="challenge-user-box opponent">


<div class="challenge-box-title">
對手物品價值
</div>


<div
id="navbar-opponent-value"
class="challenge-box-value"
>
0
</div>


</div>



</div>


</div>


</header>







<main>


<section class="challenge-room-page">


<div class="section-container">





<div class="section-header">


<span class="section-label">

Challenge Mode

</span>


<h1>

挑戰房間

</h1>


<p>

管理你的挑戰資金，決定何時停止。

</p>


</div>







<div class="room-card">






<div class="challenge-code-section">


<h3>
挑戰代碼
</h3>


<div class="challenge-code-box">


<span id="challenge-code">
-
</span>


<button
id="copy-code-button"
class="button button-secondary"
>

複製

</button>


</div>



<div
id="copy-message"
class="copy-message"
></div>


</div>








<div class="room-status">


狀態：

<span id="challenge-status">
-
</span>


</div>









<div class="vs-area">






<!-- 我的區域 -->

<div
class="room-player my-player"
>



<h2 id="my-player-name">

我的挑戰

</h2>




<div class="ec-box">


ELOCoin


<strong id="my-player-coin">

0

</strong>


</div>





<div class="value-box">


物品價值


<strong id="my-player-value">

0

</strong>


</div>






<button
id="open-case-button"
class="button button-primary"
>

選擇箱子開啟

</button>






<div class="player-inventory">


<h3>

我的物品庫

</h3>


<div
id="my-items"
class="challenge-items"
>


<div class="empty-item">

尚無物品

</div>


</div>


</div>



</div>








<div class="vs-text">

VS

</div>







<!-- 對手區域 -->

<div
class="room-player opponent-player"
>



<h2 id="opponent-name">

等待對手

</h2>





<div class="ec-box">


ELOCoin


<strong id="opponent-coin">

0

</strong>


</div>





<div class="value-box">


物品價值


<strong id="opponent-value">

0

</strong>


</div>







<div class="opponent-lock">


對手開箱資料同步中

</div>







<div class="player-inventory">


<h3>

對手物品庫

</h3>



<div
id="opponent-items"
class="challenge-items"
>


<div class="empty-item">

尚無物品

</div>


</div>


</div>



</div>







</div>









<div class="challenge-actions">


<button
id="back-room-button"
class="button button-secondary"
>

回到房間

</button>



<button
id="finish-challenge-button"
class="button button-danger"
>

結束挑戰

</button>


</div>








</div>


</div>


</section>


</main>







<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/player.js"></script>

<script src="js/challenge-room.js"></script>


</body>


</html>
