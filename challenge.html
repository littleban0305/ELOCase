<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Challenge Mode｜ELOCase
    </title>


    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/challenge.css">


</head>


<body>


<header class="navbar">

    <div class="navbar-container">


        <a href="index.html" class="brand">
            ELOCase
        </a>



        <nav class="nav-links">

            <a href="index.html" class="nav-link">
                首頁
            </a>


            <a href="cases.html" class="nav-link">
                開箱
            </a>


            <a href="challenge.html" class="nav-link active">
                挑戰模式
            </a>


            <a href="inventory.html" class="nav-link">
                我的物品
            </a>


            <a href="profile.html" class="nav-link">
                個人資料
            </a>


        </nav>



        <div class="navbar-actions">


            <div class="balance">

                <span class="balance-label">
                    $
                </span>


                <span class="balance-value">
                    0
                </span>

            </div>




            <div class="player-menu">


                <button
                    type="button"
                    class="player-menu-button"
                    id="player-menu-button"
                >

                    <span class="player-avatar">
                        ◉
                    </span>


                    <span
                        class="player-menu-name"
                        id="navbar-player-name"
                    >
                        登入
                    </span>


                    <span class="player-menu-arrow">
                        ▾
                    </span>


                </button>




                <div
                    class="player-menu-dropdown"
                    id="player-menu-dropdown"
                >

                    <a
                        href="profile.html"
                        class="player-menu-item"
                    >
                        個人資料
                    </a>



                    <a
                        href="inventory.html"
                        class="player-menu-item"
                    >
                        我的物品
                    </a>



                    <button
                        type="button"
                        class="player-menu-item player-menu-logout"
                        id="navbar-logout-button"
                    >
                        登出
                    </button>


                </div>


            </div>


        </div>


    </div>


</header>





<main>


<section class="challenge-page">


<div class="section-container">



<div class="section-header">


<span class="section-label">
挑戰模式
</span>


<h1>
ELOCase 挑戰模式
</h1>


<p>
建立挑戰房間，使用 EC 挑戰其他玩家。
</p>


</div>





<div class="challenge-actions">



<div class="challenge-card">


<h2>
建立挑戰
</h2>

<p>
建立新的挑戰房間
</p>


<label>
挑戰資金
</label>


<input
id="create-ec"
type="number"
value="10000"
>


<button
id="create-challenge-button"
class="button button-primary"
>

建立挑戰

</button>


</div>






<div class="challenge-card">


<h2>
加入挑戰
</h2>

<p>
輸入好友提供的挑戰代碼
</p>


<label>
挑戰代碼
</label>


<input
id="join-code"
placeholder="CH_xxxxxxxx"
>


<button
id="join-challenge-button"
class="button button-primary"
>

加入挑戰

</button>


</div>



</div>

<div
id="created-challenge"
class="challenge-card hidden"
>


<h2>
挑戰代碼
</h2>


<div class="challenge-code-box">


<span id="challenge-code">
-
</span>


<button
id="copy-code-button"
class="button button-secondary"
>
複製
</button>


</div>


<div
id="copy-message"
class="copy-message"
>
</div>


</div>







<section
id="challenge-room"
class="challenge-room hidden"
>


<div class="section-header">

<span class="section-label">
房間
</span>


<h2>
挑戰房間
</h2>

</div>




<div class="challenge-vs">



<div class="challenge-player-box">


<h3>
Player A
</h3>


<p>
EC：
<span id="player-a-ec">
-
</span>
</p>


<p>
物品價值：
<span id="player-a-value">
-
</span>
</p>


</div>






<div class="challenge-vs-text">

VS

</div>






<div class="challenge-player-box">


<h3>
Player B
</h3>


<p>
EC：
<span id="player-b-ec">
-
</span>
</p>


<p>
物品價值：
<span id="player-b-value">
-
</span>
</p>


</div>



</div>


</section>



</div>


</section>


</main>





<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script src="js/challenge.js"></script>


</body>

</html>
