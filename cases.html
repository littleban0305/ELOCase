<main id="case-page">

    <section class="case-detail">

        <div
            id="case-image"
            class="case-detail-image"
        >
            ELOCase
        </div>


        <div class="case-detail-info">

            <div
                id="case-game"
                class="case-detail-game"
            ></div>


            <h1 id="case-name">
                載入中...
            </h1>


            <p
                id="case-description"
                class="case-detail-description"
            ></p>


            <div class="case-detail-bottom">

                <span
                    id="case-price"
                    class="case-detail-price"
                >
                    $0
                </span>


                <button
                    type="button"
                    class="button button-primary"
                    id="open-case-button"
                >
                    開啟箱子
                </button>

            </div>

        </div>

    </section>


    <section class="case-contents">

        <div class="section-header">

            <h2>箱子內容物</h2>

        </div>


        <div
            id="case-items"
            class="case-items-grid"
        >

            <div class="case-items-loading">
                載入中...
            </div>

        </div>

    </section>

</main>
