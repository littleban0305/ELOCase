<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ELOCase - 開箱</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/cases.css">

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header class="navbar">

        <div class="navbar-container">


            <!-- 品牌 -->

            <a
                href="index.html"
                class="brand"
            >
                ELOCase
            </a>


            <!-- 導覽 -->

            <nav class="nav-links">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    首頁
                </a>


                <a
                    href="cases.html"
                    class="nav-link active"
                >
                    開箱
                </a>


                <a
                    href="inventory.html"
                    class="nav-link"
                >
                    我的物品
                </a>


                <a
                    href="profile.html"
                    class="nav-link"
                >
                    個人資料
                </a>

            </nav>


            <!-- 右側 -->

            <div class="navbar-actions">


                <!-- 餘額 -->

                <div class="balance">

                    <span class="balance-label">
                        $
                    </span>

                    <span
                        class="balance-value"
                    >
                        50
                    </span>

                </div>


                <!-- 登入 -->

                <a
                    href="login.html"
                    class="button button-primary"
                >
                    登入
                </a>

            </div>

        </div>

    </header>



    <!-- ========================================
         主要內容
    ======================================== -->

    <main>

        <section class="cases-page">

            <div class="section-container">


                <!-- 頁面標題 -->

                <div class="cases-header">

                    <span class="section-label">
                        開箱
                    </span>

                    <h1>
                        箱子
                    </h1>

                </div>


                <!-- 箱子列表 -->

                <div
                    id="case-grid"
                    class="case-grid"
                >

                    <div class="case-loading">
                        載入箱子中...
                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         Footer
    ======================================== -->

    <footer class="footer">

        <div class="footer-container">

            <div class="footer-brand">
                ELOCase
            </div>

            <p>
                CS2 虛擬物品平台
            </p>

            <span>
                © 2026 ELOCase
            </span>

        </div>

    </footer>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>


    <script>

        /*
         * ====================================
         * 載入箱子
         * ====================================
         */

        async function initializeCasesPage() {

            const caseGrid =
                document.querySelector(
                    "#case-grid"
                );


            if (!caseGrid) {
                return;
            }


            try {

                const cases =
                    await getCases();


                renderCases(
                    cases
                );


            } catch (error) {

                console.error(
                    "箱子資料載入失敗：",
                    error
                );


                caseGrid.innerHTML = `

                    <div class="case-loading">

                        箱子資料載入失敗。

                    </div>

                `;

            }

        }


        /*
         * ====================================
         * 初始化
         * ====================================
         */

        initializeCasesPage();

    </script>


</body>

</html>
