<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>開箱｜ELOCase</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/cases.css"
    >

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header class="navbar">

        <div class="navbar-container">


            <!-- 品牌 -->

            <a
                href="index.html"
                class="brand"
            >
                ELOCase
            </a>


            <!-- 導覽 -->

            <nav class="nav-links">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    首頁
                </a>


                <a
                    href="cases.html"
                    class="nav-link active"
                >
                    開箱
                </a>


                <a
                    href="inventory.html"
                    class="nav-link"
                >
                    我的物品
                </a>


                <a
                    href="profile.html"
                    class="nav-link"
                >
                    個人資料
                </a>

            </nav>


            <!-- ====================================
                 右側
            ==================================== -->

            <div class="navbar-actions">


                <!-- 餘額 -->

                <div class="balance">

                    <span class="balance-label">
                        $
                    </span>

                    <span
                        class="balance-value"
                    >
                        0
                    </span>

                </div>


                <!-- 玩家選單 -->

                <div class="player-menu">


                    <button
                        type="button"
                        class="player-menu-button"
                        id="player-menu-button"
                    >

                        <span class="player-avatar">
                            ◉
                        </span>


                        <span
                            class="player-menu-name"
                            id="navbar-player-name"
                        >
                            登入
                        </span>


                        <span class="player-menu-arrow">
                            ▾
                        </span>

                    </button>


                    <div
                        class="player-menu-dropdown"
                        id="player-menu-dropdown"
                    >

                        <a
                            href="profile.html"
                            class="player-menu-item"
                        >
                            個人資料
                        </a>


                        <a
                            href="inventory.html"
                            class="player-menu-item"
                        >
                            我的物品
                        </a>


                        <button
                            type="button"
                            class="player-menu-item player-menu-logout"
                            id="navbar-logout-button"
                        >
                            登出
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </header>



    <!-- ========================================
         主要內容
    ======================================== -->

    <main>

        <section class="cases-page">

            <div class="section-container">


                <!-- ====================================
                     頁面標題
                ==================================== -->

                <div class="cases-header">

                    <span class="section-label">
                        開箱
                    </span>


                    <h1>
                        箱子
                    </h1>

                </div>


                <!-- ====================================
                     箱子列表
                ==================================== -->

                <div
                    id="case-grid"
                    class="case-grid"
                >

                    <div class="case-loading">
                        載入箱子中...
                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         Footer
    ======================================== -->

    <footer class="footer">
    
        <div class="footer-container">
    
            <div class="footer-brand">
                ELOCase
            </div>
    
            <p>
                CS2 虛擬物品平台
            </p>
    
            <span>
                © 2026 ELOCase
            </span>
    
        </div>
    
    </footer>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>


    <script>

        /* ========================================
           初始化
        ======================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                try {

                    /*
                     * ------------------------------
                     * 載入玩家資料
                     * ------------------------------
                     */

                    const user =
                        await verifySession();


                    updateLoginUI(
                        user
                    );


                    /*
                     * ------------------------------
                     * 載入箱子
                     * ------------------------------
                     */

                    const cases =
                        await getCases();


                    renderCases(
                        cases
                    );


                } catch (error) {

                    console.error(
                        "開箱頁載入失敗：",
                        error
                    );


                    const container =
                        document.querySelector(
                            "#case-grid"
                        );


                    if (container) {

                        container.innerHTML = `

                            <div class="case-loading">

                                箱子資料載入失敗

                            </div>

                        `;

                    }

                }

            }
        );

    </script>


</body>

</html>
