<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>開箱｜ELOCase</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/cases.css"
    >

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header
        class="navbar"
        id="navbar"
    ></header>



    <!-- ========================================
         主要內容
    ======================================== -->

    <main>

        <section class="cases-page">

            <div class="section-container">


                <!-- ====================================
                     頁面標題
                ==================================== -->

                <div class="cases-header">

                    <span class="section-label">
                        開箱
                    </span>


                    <h1>
                        箱子
                    </h1>

                </div>


                <!-- ====================================
                     箱子列表
                ==================================== -->

                <div
                    id="case-grid"
                    class="case-grid"
                >

                    <div class="case-loading">
                        載入箱子中...
                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         Footer
    ======================================== -->

    <footer class="footer">
    
        <div class="footer-container">
    
            <div class="footer-brand">
                ELOCase
            </div>
    
            <p>
                CS2 虛擬物品平台
            </p>
    
            <span>
                © 2026 ELOCase
            </span>
    
        </div>
    
    </footer>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/loading.js"></script>
    
    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/navbar.js"></script>

    <script src="js/cases.js"></script>


    <script>

        /* ========================================
           初始化
        ======================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                try {

                    /*
                     * ------------------------------
                     * 載入玩家資料
                     * ------------------------------
                     */

                    const user =
                        await verifySession();


                    updateLoginUI(
                        user
                    );


                    /*
                     * ------------------------------
                     * 載入箱子
                     * ------------------------------
                     */

                    const cases =
                        await getCases();


                    renderCases(
                        cases
                    );


                } catch (error) {

                    console.error(
                        "開箱頁載入失敗：",
                        error
                    );


                    const container =
                        document.querySelector(
                            "#case-grid"
                        );


                    if (container) {

                        container.innerHTML = `

                            <div class="case-loading">

                                箱子資料載入失敗

                            </div>

                        `;

                    }

                }

            }
        );

    </script>


</body>

</html>
