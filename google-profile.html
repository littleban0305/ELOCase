<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        完善帳號｜ELOCase
    </title>


    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">


</head>


<body>


<header class="navbar">

    <div class="navbar-container">


        <a
            href="index.html"
            class="brand"
        >
            ELOCase
        </a>


    </div>


</header>




<main>


<section class="login-page">


<div class="login-card">



<div class="login-header">


<span class="section-label">
    Google 註冊
</span>


<h1>
    完善你的帳號
</h1>


<p>
    設定你的 ELOCase 玩家資料
</p>


</div>




<div
    class="google-profile-info"
>


<img
    id="google-avatar"
    class="google-avatar"
>



<div>


<h3
    id="google-name"
>
</h3>


<p
    id="google-email"
>
</p>


</div>


</div>





<form id="google-profile-form">



<div class="form-group">


<label
    for="username"
>
    玩家名稱
</label>


<input

    id="username"

    type="text"

    placeholder="輸入玩家名稱"

    required

>


</div>





<div class="form-group">


<label
    for="displayName"
>
    顯示名稱
</label>


<input

    id="displayName"

    type="text"

    placeholder="遊戲內顯示名稱"

    required

>


</div>





<button

    type="submit"

    class="button button-primary button-large"

>

建立 ELOCase 帳號

</button>



</form>




<div
    id="google-profile-message"
    class="login-message"
>
</div>



</div>


</section>


</main>





<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/google-profile.js"></script>



</body>

</html>
