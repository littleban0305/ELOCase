<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>個人資料｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/profile.css">

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header
        class="navbar"
        id="navbar"
    ></header>



    <!-- ========================================
         個人頁面
    ======================================== -->

    <main>

        <section class="profile-page">

            <div class="profile-container">


                <!-- ========================================
                     玩家標頭
                ======================================== -->

                <div class="profile-header">


                    <div class="profile-user">


                        <div class="profile-avatar">

                            <span>
                                ◉
                            </span>

                        </div>


                        <div class="profile-user-info">

                            <h1 id="profile-name">
                                載入中...
                            </h1>

                            <p id="profile-username">
                                玩家名稱：-
                            </p>

                        </div>

                    </div>



                    <!-- 玩家數據 -->

                    <div class="profile-balance-box">


                        <div class="profile-balance-item">

                            <span>
                                ELOCoin
                            </span>

                            <strong id="profile-balance">
                                $0
                            </strong>

                        </div>


                        <div class="profile-balance-divider"></div>


                        <div class="profile-balance-item">

                            <span>
                                等級
                            </span>

                            <strong id="profile-level">
                                Lv.0
                            </strong>

                        </div>

                    </div>


                </div>



                <!-- ========================================
                     快速操作
                ======================================== -->

                <div class="profile-nav">


                    <a
                        href="inventory.html"
                        class="profile-nav-button"
                    >

                        <span class="profile-nav-icon">
                            ◇
                        </span>

                        <span>
                            我的物品
                        </span>

                        <span class="profile-nav-arrow">
                            →
                        </span>

                    </a>


                    <a
                        href="cases.html"
                        class="profile-nav-button primary"
                    >

                        <span class="profile-nav-icon">
                            ◆
                        </span>

                        <span>
                            開始開箱
                        </span>

                        <span class="profile-nav-arrow">
                            →
                        </span>

                    </a>

                </div>



                <!-- ========================================
                     玩家資訊
                ======================================== -->

                <div class="profile-section">


                    <div class="profile-section-header">

                        <h2>
                            玩家資訊
                        </h2>

                    </div>


                    <div class="profile-details">


                        <div class="profile-detail-row">

                            <span class="profile-detail-label">
                                玩家名稱
                            </span>

                            <strong id="info-username">
                                -
                            </strong>

                        </div>


                        <div class="profile-detail-row">

                            <span class="profile-detail-label">
                                顯示名稱
                            </span>

                            <strong id="info-display-name">
                                -
                            </strong>

                        </div>


                        <div class="profile-detail-row">

                            <span class="profile-detail-label">
                                玩家等級
                            </span>

                            <strong id="info-level">
                                Lv.0
                            </strong>

                        </div>


                    </div>

                </div>



                <!-- ========================================
                     帳號操作
                ======================================== -->

                <div class="profile-account">
                
                    <div>
                
                        <h2>
                            帳號
                        </h2>
                
                        <p>
                            管理目前的 ELOCase 帳號
                        </p>
                
                    </div>
                
                
                    <div class="profile-account-actions">
                
                        <button
                            id="edit-profile-button"
                            class="profile-edit-button"
                            type="button"
                        >
                            編輯資料
                        </button>
                
                
                        <button
                            id="logout-button"
                            class="profile-logout-button"
                            type="button"
                        >
                            登出
                        </button>
                
                    </div>
                
                </div>

                <!-- ========================================
                 編輯資料 Modal
                ======================================== -->
                
                <div
                    class="profile-modal"
                    id="edit-profile-modal"
                >
                
                    <div
                        class="profile-modal-backdrop"
                        id="edit-profile-backdrop"
                    ></div>
                
                
                    <div class="profile-modal-box">
                
                
                        <div class="profile-modal-header">
                
                            <div>
                
                                <span class="profile-modal-label">
                                    PROFILE
                                </span>
                
                                <h2>
                                    編輯資料
                                </h2>
                
                            </div>
                
                
                            <button
                                type="button"
                                class="profile-modal-close"
                                id="edit-profile-close"
                            >
                                ×
                            </button>
                
                        </div>
                
                
                
                        <div class="profile-modal-body">
                
                
                            <!-- 顯示名稱 -->
                
                            <div class="profile-form-group">
                
                                <label for="edit-display-name">
                                    顯示名稱
                                </label>
                
                                <input
                                    type="text"
                                    id="edit-display-name"
                                    maxlength="30"
                                    autocomplete="off"
                                    placeholder="輸入顯示名稱"
                                >
                
                                <span class="profile-form-hint">
                                    這個名稱會顯示在你的 ELOCase 個人頁面
                                </span>
                
                            </div>
                
                
                
                            <!-- 玩家名稱 -->
                
                            <div class="profile-form-group">
                
                                <label for="edit-username">
                                    玩家名稱
                                </label>
                
                                <input
                                    type="text"
                                    id="edit-username"
                                    disabled
                                >
                
                                <span class="profile-form-hint">
                                    玩家名稱無法修改
                                </span>
                
                            </div>
                
                
                        </div>
                
                
                
                        <div class="profile-modal-footer">
                
                            <button
                                type="button"
                                class="profile-modal-button secondary"
                                id="edit-profile-cancel"
                            >
                                取消
                            </button>
                
                
                            <button
                                type="button"
                                class="profile-modal-button primary"
                                id="edit-profile-save"
                            >
                                儲存
                            </button>
                
                        </div>
                
                
                    </div>
                
                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/loading.js"></script>

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/navbar.js"></script>


    <script>

        async function initializeProfile() {

            const user =
                await requireLogin();


            if (!user) {

                return;

            }


            /* ========================================
               基本資料
            ======================================== */

            const displayName =
                user.displayName ||
                user.username ||
                "玩家";


            const username =
                user.username ||
                "-";


            const level =
                Number(
                    user.level ?? 0
                );


            const eloCoin =
                Number(
                    user.eloCoin || 0
                );


            /* ========================================
               Hero 名稱
            ======================================== */

            const profileName =
                document.querySelector(
                    "#profile-name"
                );


            if (profileName) {

                profileName.textContent =
                    displayName;

            }


            /* ========================================
               Hero 帳號
            ======================================== */

            const profileUsername =
                document.querySelector(
                    "#profile-username"
                );


            if (profileUsername) {

                profileUsername.textContent =
                    `玩家名稱：${username}`;

            }


            /* ========================================
               ELOCoin
            ======================================== */

            const profileBalance =
                document.querySelector(
                    "#profile-balance"
                );


            if (profileBalance) {

                profileBalance.textContent =
                    `$${eloCoin.toLocaleString()}`;

            }


            /* ========================================
               等級
            ======================================== */

            const profileLevel =
                document.querySelector(
                    "#profile-level"
                );


            if (profileLevel) {

                profileLevel.textContent =
                    `Lv.${level}`;

            }


            /* ========================================
               玩家資訊
            ======================================== */

            const infoUsername =
                document.querySelector(
                    "#info-username"
                );


            if (infoUsername) {

                infoUsername.textContent =
                    username;

            }


            const infoDisplayName =
                document.querySelector(
                    "#info-display-name"
                );


            if (infoDisplayName) {

                infoDisplayName.textContent =
                    displayName;

            }


            const infoLevel =
                document.querySelector(
                    "#info-level"
                );


            if (infoLevel) {

                infoLevel.textContent =
                    `Lv.${level}`;

            }


            /* ========================================
               Navbar 餘額
            ======================================== */

            const balance =
                document.querySelector(
                    ".balance-value"
                );


            if (balance) {

                balance.textContent =
                    eloCoin.toLocaleString();

            }


            /* ========================================
               登出
            ======================================== */

            const logoutButton =
                document.querySelector(
                    "#logout-button"
                );


            if (logoutButton) {

                logoutButton.addEventListener(
                    "click",
                    logout
                );

            }

        }

        /* ========================================
           編輯資料 Modal
        ======================================== */
        
        const editProfileButton =
            document.querySelector(
                "#edit-profile-button"
            );
        
        
        const editProfileModal =
            document.querySelector(
                "#edit-profile-modal"
            );
        
        
        const editProfileClose =
            document.querySelector(
                "#edit-profile-close"
            );
        
        
        const editProfileCancel =
            document.querySelector(
                "#edit-profile-cancel"
            );
        
        
        const editProfileBackdrop =
            document.querySelector(
                "#edit-profile-backdrop"
            );
        
        
        const editDisplayName =
            document.querySelector(
                "#edit-display-name"
            );
        
        
        const editUsername =
            document.querySelector(
                "#edit-username"
            );
        
        
        function openEditProfileModal() {
        
            const user =
                getSavedUser();
        
        
            if (!user) {
        
                return;
        
            }
        
        
            editDisplayName.value =
                user.displayName ||
                user.username ||
                "";
        
        
            editUsername.value =
                user.username ||
                "";
        
        
            editProfileModal.classList.add(
                "show"
            );
        
        }
        
        
        function closeEditProfileModal() {
        
            editProfileModal.classList.remove(
                "show"
            );
        
        }
        
        
        if (editProfileButton) {
        
            editProfileButton.addEventListener(
                "click",
                openEditProfileModal
            );
        
        }
        
        
        if (editProfileClose) {
        
            editProfileClose.addEventListener(
                "click",
                closeEditProfileModal
            );
        
        }
        
        
        if (editProfileCancel) {
        
            editProfileCancel.addEventListener(
                "click",
                closeEditProfileModal
            );
        
        }
        
        
        if (editProfileBackdrop) {
        
            editProfileBackdrop.addEventListener(
                "click",
                closeEditProfileModal
            );
        
        }

        /* ========================================
           儲存編輯資料
        ======================================== */
        
        const editProfileSave =
            document.querySelector(
                "#edit-profile-save"
            );
        
        
        if (editProfileSave) {
        
            editProfileSave.addEventListener(
                "click",
                async () => {
        
                    /*
                     * 防止重複點擊
                     */
        
                    if (
                        editProfileSave.disabled
                    ) {
        
                        return;
        
                    }
        
        
                    /*
                     * 取得 Session Token
                     */
        
                    const sessionToken =
                        getSessionToken();
        
        
                    if (!sessionToken) {
        
                        alert(
                            "登入狀態已失效，請重新登入"
                        );
        
                        return;
        
                    }
        
        
                    /*
                     * 取得新的顯示名稱
                     */
        
                    const newDisplayName =
                        editDisplayName.value.trim();
        
        
                    /*
                     * 檢查是否為空
                     */
        
                    if (!newDisplayName) {
        
                        alert(
                            "顯示名稱不能為空"
                        );
        
                        editDisplayName.focus();
        
                        return;
        
                    }
        
        
                    /*
                     * 檢查長度
                     */
        
                    if (
                        newDisplayName.length > 30
                    ) {
        
                        alert(
                            "顯示名稱最多 30 個字"
                        );
        
                        editDisplayName.focus();
        
                        return;
        
                    }
        
        
                    try {
        
                        /*
                         * 鎖定儲存按鈕
                         */
        
                        editProfileSave.disabled =
                            true;
        
                        editProfileSave.textContent =
                            "儲存中...";
        
        
                        /*
                         * ====================================
                         * 呼叫後端 updatePlayer
                         * ====================================
                         */
        
                        const updatedUser =
                            await updatePlayer(
                                newDisplayName
                            );
        
        
                        /*
                         * ====================================
                         * 更新 LocalStorage
                         * ====================================
                         */
        
                        localStorage.setItem(
                            "elocaseUser",
                            JSON.stringify(
                                updatedUser
                            )
                        );
        
        
                        /*
                         * ====================================
                         * 更新頁面上的玩家名稱
                         * ====================================
                         */
        
                        const profileName =
                            document.querySelector(
                                "#profile-name"
                            );
        
        
                        if (profileName) {
        
                            profileName.textContent =
                                updatedUser.displayName ||
                                updatedUser.username ||
                                "玩家";
        
                        }
        
        
                        /*
                         * ====================================
                         * 更新 Navbar 玩家名稱
                         * ====================================
                         */
        
                        const navbarPlayerName =
                            document.querySelector(
                                "#navbar-player-name"
                            );
        
        
                        if (navbarPlayerName) {
        
                            navbarPlayerName.textContent =
                                updatedUser.displayName ||
                                updatedUser.username ||
                                "玩家";
        
                        }
        
        
                        /*
                         * ====================================
                         * 如果頁面有顯示名稱資訊
                         * 一起更新
                         * ====================================
                         */
        
                        const infoDisplayName =
                            document.querySelector(
                                "#info-display-name"
                            );
        
        
                        if (infoDisplayName) {
        
                            infoDisplayName.textContent =
                                updatedUser.displayName ||
                                updatedUser.username ||
                                "-";
        
                        }
        
        
                        /*
                         * ====================================
                         * 關閉編輯視窗
                         * ====================================
                         */
        
                        closeEditProfileModal();
        
        
                    } catch (error) {
        
                        console.error(
                            "❌ 更新玩家資料失敗：",
                            error
                        );
        
        
                        alert(
                            error.message ||
                            "更新失敗，請稍後再試"
                        );
        
        
                    } finally {
        
                        /*
                         * 恢復儲存按鈕
                         */
        
                        editProfileSave.disabled =
                            false;
        
                        editProfileSave.textContent =
                            "儲存";
        
                    }
        
                }
            );
        
        }

        initializeProfile();

    </script>


</body>

</html>
