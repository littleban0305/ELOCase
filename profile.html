<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>個人資料｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/profile.css">

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header class="navbar">

        <div class="navbar-container">


            <a
                href="index.html"
                class="brand"
            >
                ELOCase
            </a>


            <nav class="nav-links">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    首頁
                </a>


                <a
                    href="cases.html"
                    class="nav-link"
                >
                    開箱
                </a>


                <a
                    href="inventory.html"
                    class="nav-link"
                >
                    我的物品
                </a>


                <a
                    href="profile.html"
                    class="nav-link active"
                >
                    個人資料
                </a>

            </nav>


            <div class="navbar-actions">


                <!-- ELOCoin -->

                <div class="balance">

                    <span class="balance-label">
                        $
                    </span>

                    <span
                        class="balance-value"
                    >
                        0
                    </span>

                </div>


                <!-- 玩家選單 -->

                <div class="player-menu">

                    <button
                        type="button"
                        class="player-menu-button"
                        id="player-menu-button"
                    >

                        <span class="player-avatar">
                            ◉
                        </span>

                        <span
                            class="player-menu-name"
                            id="navbar-player-name"
                        >
                            登入
                        </span>

                        <span class="player-menu-arrow">
                            ▾
                        </span>

                    </button>


                    <div
                        class="player-menu-dropdown"
                        id="player-menu-dropdown"
                    >

                        <a
                            href="profile.html"
                            class="player-menu-item"
                        >
                            個人資料
                        </a>


                        <a
                            href="inventory.html"
                            class="player-menu-item"
                        >
                            我的物品
                        </a>


                        <button
                            type="button"
                            class="player-menu-item player-menu-logout"
                            id="navbar-logout-button"
                        >
                            登出
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </header>



    <!-- ========================================
         個人頁面
    ======================================== -->

    <main>

        <section class="profile-page">

            <div class="profile-container">


                <!-- ========================================
                     玩家標頭
                ======================================== -->

                <div class="profile-header">


                    <div class="profile-user">


                        <div class="profile-avatar">

                            <span>
                                ◉
                            </span>

                        </div>


                        <div class="profile-user-info">

                            <h1 id="profile-name">
                                載入中...
                            </h1>

                            <p id="profile-username">
                                玩家名稱：-
                            </p>

                        </div>

                    </div>



                    <!-- 玩家數據 -->

                    <div class="profile-balance-box">


                        <div class="profile-balance-item">

                            <span>
                                ELOCoin
                            </span>

                            <strong id="profile-balance">
                                $0
                            </strong>

                        </div>


                        <div class="profile-balance-divider"></div>


                        <div class="profile-balance-item">

                            <span>
                                等級
                            </span>

                            <strong id="profile-level">
                                Lv.0
                            </strong>

                        </div>

                    </div>


                </div>



                <!-- ========================================
                     快速操作
                ======================================== -->

                <div class="profile-nav">


                    <a
                        href="inventory.html"
                        class="profile-nav-button"
                    >

                        <span class="profile-nav-icon">
                            ◇
                        </span>

                        <span>
                            我的物品
                        </span>

                        <span class="profile-nav-arrow">
                            →
                        </span>

                    </a>


                    <a
                        href="cases.html"
                        class="profile-nav-button primary"
                    >

                        <span class="profile-nav-icon">
                            ◆
                        </span>

                        <span>
                            開始開箱
                        </span>

                        <span class="profile-nav-arrow">
                            →
                        </span>

                    </a>

                </div>



                <!-- ========================================
                     玩家資訊
                ======================================== -->

                <div class="profile-section">


                    <div class="profile-section-header">

                        <h2>
                            玩家資訊
                        </h2>

                    </div>


                    <div class="profile-details">


                        <div class="profile-detail-row">

                            <span class="profile-detail-label">
                                玩家名稱
                            </span>

                            <strong id="info-username">
                                -
                            </strong>

                        </div>


                        <div class="profile-detail-row">

                            <span class="profile-detail-label">
                                顯示名稱
                            </span>

                            <strong id="info-display-name">
                                -
                            </strong>

                        </div>


                        <div class="profile-detail-row">

                            <span class="profile-detail-label">
                                玩家等級
                            </span>

                            <strong id="info-level">
                                Lv.0
                            </strong>

                        </div>


                    </div>

                </div>



                <!-- ========================================
                     帳號操作
                ======================================== -->

                <div class="profile-account">
                
                    <div>
                
                        <h2>
                            帳號
                        </h2>
                
                        <p>
                            管理目前的 ELOCase 帳號
                        </p>
                
                    </div>
                
                
                    <div class="profile-account-actions">
                
                        <button
                            id="edit-profile-button"
                            class="profile-edit-button"
                            type="button"
                        >
                            編輯資料
                        </button>
                
                
                        <button
                            id="logout-button"
                            class="profile-logout-button"
                            type="button"
                        >
                            登出
                        </button>
                
                    </div>
                
                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/loading.js"></script>

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>


    <script>

        async function initializeProfile() {

            const user =
                await requireLogin();


            if (!user) {

                return;

            }


            /* ========================================
               基本資料
            ======================================== */

            const displayName =
                user.displayName ||
                user.username ||
                "玩家";


            const username =
                user.username ||
                "-";


            const level =
                Number(
                    user.level ?? 0
                );


            const eloCoin =
                Number(
                    user.eloCoin || 0
                );


            /* ========================================
               Hero 名稱
            ======================================== */

            const profileName =
                document.querySelector(
                    "#profile-name"
                );


            if (profileName) {

                profileName.textContent =
                    displayName;

            }


            /* ========================================
               Hero 帳號
            ======================================== */

            const profileUsername =
                document.querySelector(
                    "#profile-username"
                );


            if (profileUsername) {

                profileUsername.textContent =
                    `玩家名稱：${username}`;

            }


            /* ========================================
               ELOCoin
            ======================================== */

            const profileBalance =
                document.querySelector(
                    "#profile-balance"
                );


            if (profileBalance) {

                profileBalance.textContent =
                    `$${eloCoin.toLocaleString()}`;

            }


            /* ========================================
               等級
            ======================================== */

            const profileLevel =
                document.querySelector(
                    "#profile-level"
                );


            if (profileLevel) {

                profileLevel.textContent =
                    `Lv.${level}`;

            }


            /* ========================================
               玩家資訊
            ======================================== */

            const infoUsername =
                document.querySelector(
                    "#info-username"
                );


            if (infoUsername) {

                infoUsername.textContent =
                    username;

            }


            const infoDisplayName =
                document.querySelector(
                    "#info-display-name"
                );


            if (infoDisplayName) {

                infoDisplayName.textContent =
                    displayName;

            }


            const infoLevel =
                document.querySelector(
                    "#info-level"
                );


            if (infoLevel) {

                infoLevel.textContent =
                    `Lv.${level}`;

            }


            /* ========================================
               Navbar 餘額
            ======================================== */

            const balance =
                document.querySelector(
                    ".balance-value"
                );


            if (balance) {

                balance.textContent =
                    eloCoin.toLocaleString();

            }


            /* ========================================
               登出
            ======================================== */

            const logoutButton =
                document.querySelector(
                    "#logout-button"
                );


            if (logoutButton) {

                logoutButton.addEventListener(
                    "click",
                    logout
                );

            }

        }


        initializeProfile();

    </script>


</body>

</html>
