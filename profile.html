<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>個人資料｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header class="navbar">

        <div class="navbar-container">


            <!-- 品牌 -->

            <a
                href="index.html"
                class="brand"
            >
                ELOCase
            </a>


            <!-- 導覽 -->

            <nav class="nav-links">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    首頁
                </a>


                <a
                    href="cases.html"
                    class="nav-link"
                >
                    開箱
                </a>


                <a
                    href="inventory.html"
                    class="nav-link"
                >
                    我的物品
                </a>


                <a
                    href="profile.html"
                    class="nav-link active"
                >
                    個人資料
                </a>

            </nav>


            <!-- 右側 -->

            <div class="navbar-actions">


                <!-- 餘額 -->

                <div class="balance">

                    <span class="balance-label">
                        $
                    </span>

                    <span
                        class="balance-value"
                    >
                        0
                    </span>

                </div>


                <!-- 玩家 -->

                <a
                    href="profile.html"
                    class="button button-primary"
                >
                    個人資料
                </a>

            </div>

        </div>

    </header>



    <!-- ========================================
         個人資料
    ======================================== -->

    <main>

        <section class="section-container">


            <div class="section-header">

                <span class="section-label">
                    玩家
                </span>

                <h1>
                    個人資料
                </h1>

            </div>


            <div class="feature-card">

                <div class="feature-content">


                    <!-- 玩家名稱 -->

                    <h3 id="profile-name">
                        載入中...
                    </h3>


                    <!-- 帳號 -->

                    <p id="profile-username">
                        玩家名稱：-
                    </p>


                    <!-- 餘額 -->

                    <p id="profile-balance">
                        餘額：$0
                    </p>


                    <!-- 等級 -->

                    <p id="profile-level">
                        等級：-
                    </p>


                    <!-- 登出 -->

                    <button
                        id="logout-button"
                        class="button button-secondary"
                        type="button"
                    >
                        登出
                    </button>


                </div>

            </div>

        </section>

    </main>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>


    <script>

        async function initializeProfile() {

            const user =
                await requireLogin();


            if (!user) {

                return;

            }


            /*
             * 玩家名稱
             */

            const profileName =
                document.querySelector(
                    "#profile-name"
                );


            if (profileName) {

                profileName.textContent =
                    user.displayName ||
                    user.username ||
                    "玩家";

            }


            /*
             * 玩家帳號
             */

            const profileUsername =
                document.querySelector(
                    "#profile-username"
                );


            if (profileUsername) {

                profileUsername.textContent =
                    `玩家名稱：${user.username}`;

            }


            /*
             * 餘額
             */

            const profileBalance =
                document.querySelector(
                    "#profile-balance"
                );


            if (profileBalance) {

                profileBalance.textContent =
                    `餘額：$${Number(
                        user.eloCoin || 0
                    ).toLocaleString()}`;

            }


            /*
             * 等級
             */

            const profileLevel =
                document.querySelector(
                    "#profile-level"
                );


            if (profileLevel) {

                profileLevel.textContent =
                    `等級：${user.level ?? 0}`;

            }


            /*
             * Navbar 餘額
             */

            const balance =
                document.querySelector(
                    ".balance-value"
                );


            if (balance) {

                balance.textContent =
                    Number(
                        user.eloCoin || 0
                    ).toLocaleString();

            }


            /*
             * 登出
             */

            const logoutButton =
                document.querySelector(
                    "#logout-button"
                );


            if (logoutButton) {

                logoutButton.addEventListener(
                    "click",
                    logout
                );

            }

        }


        initializeProfile();

    </script>


</body>

</html>
