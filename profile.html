<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>個人資料｜ELOCase</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/profile.css">

</head>


<body>


    <!-- ========================================
         導覽列
    ======================================== -->

    <header class="navbar">

        <div class="navbar-container">


            <!-- 品牌 -->

            <a
                href="index.html"
                class="brand"
            >
                ELOCase
            </a>


            <!-- 導覽 -->

            <nav class="nav-links">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    首頁
                </a>


                <a
                    href="cases.html"
                    class="nav-link"
                >
                    開箱
                </a>


                <a
                    href="inventory.html"
                    class="nav-link"
                >
                    我的物品
                </a>


                <a
                    href="profile.html"
                    class="nav-link active"
                >
                    個人資料
                </a>

            </nav>


            <!-- 右側 -->

            <div class="navbar-actions">


                <!-- 餘額 -->

                <div class="balance">

                    <span class="balance-label">
                        $
                    </span>

                    <span
                        class="balance-value"
                    >
                        0
                    </span>

                </div>


                <!-- 玩家 -->

                <div class="player-menu">

                    <button
                        type="button"
                        class="player-menu-button"
                        id="player-menu-button"
                    >

                        <span class="player-avatar">
                            ◉
                        </span>

                        <span
                            class="player-menu-name"
                            id="navbar-player-name"
                        >
                            登入
                        </span>

                        <span class="player-menu-arrow">
                            ▾
                        </span>

                    </button>


                    <div
                        class="player-menu-dropdown"
                        id="player-menu-dropdown"
                    >

                        <a
                            href="profile.html"
                            class="player-menu-item"
                        >
                            個人資料
                        </a>


                        <a
                            href="inventory.html"
                            class="player-menu-item"
                        >
                            我的物品
                        </a>


                        <button
                            type="button"
                            class="player-menu-item player-menu-logout"
                            id="navbar-logout-button"
                        >
                            登出
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </header>



    <!-- ========================================
         個人資料
    ======================================== -->

    <main>

        <section class="profile-page">

            <div class="profile-container">


                <!-- ========================================
                     個人 Hero
                ======================================== -->

                <div class="profile-hero">


                    <!-- 背景裝飾 -->

                    <div class="profile-hero-glow"></div>


                    <!-- 頭像 -->

                    <div class="profile-avatar">

                        <span>
                            ◉
                        </span>

                    </div>


                    <!-- 玩家資訊 -->

                    <div class="profile-identity">

                        <span class="profile-label">
                            ELOCASE PLAYER
                        </span>

                        <h1 id="profile-name">
                            載入中...
                        </h1>

                        <p id="profile-username">
                            玩家名稱：-
                        </p>

                        <div class="profile-online">

                            <span class="profile-online-dot"></span>

                            ONLINE

                        </div>

                    </div>


                </div>



                <!-- ========================================
                     玩家數據
                ======================================== -->

                <div class="profile-stats">


                    <!-- ELOCoin -->

                    <div class="profile-stat">

                        <div class="profile-stat-icon coin-icon">
                            $
                        </div>

                        <div>

                            <span class="profile-stat-label">
                                ELOCoin
                            </span>

                            <strong id="profile-balance">
                                $0
                            </strong>

                        </div>

                    </div>


                    <!-- 等級 -->

                    <div class="profile-stat">

                        <div class="profile-stat-icon">
                            LV
                        </div>

                        <div>

                            <span class="profile-stat-label">
                                玩家等級
                            </span>

                            <strong id="profile-level">
                                Lv.0
                            </strong>

                        </div>

                    </div>


                    <!-- 狀態 -->

                    <div class="profile-stat">

                        <div class="profile-stat-icon">
                            ◈
                        </div>

                        <div>

                            <span class="profile-stat-label">
                                帳號狀態
                            </span>

                            <strong class="profile-active">
                                正常
                            </strong>

                        </div>

                    </div>

                </div>



                <!-- ========================================
                     玩家資訊
                ======================================== -->

                <div class="profile-card">


                    <div class="profile-card-header">

                        <div>

                            <span class="profile-label">
                                PLAYER
                            </span>

                            <h2>
                                玩家資訊
                            </h2>

                        </div>

                    </div>


                    <div class="profile-info">


                        <div class="profile-info-row">

                            <div>

                                <span class="profile-info-label">
                                    玩家名稱
                                </span>

                                <span class="profile-info-description">
                                    你的 ELOCase 玩家帳號
                                </span>

                            </div>

                            <strong id="info-username">
                                -
                            </strong>

                        </div>


                        <div class="profile-info-row">

                            <div>

                                <span class="profile-info-label">
                                    顯示名稱
                                </span>

                                <span class="profile-info-description">
                                    在 ELOCase 顯示的名稱
                                </span>

                            </div>

                            <strong id="info-display-name">
                                -
                            </strong>

                        </div>


                        <div class="profile-info-row">

                            <div>

                                <span class="profile-info-label">
                                    玩家等級
                                </span>

                                <span class="profile-info-description">
                                    目前帳號等級
                                </span>

                            </div>

                            <strong id="info-level">
                                Lv.0
                            </strong>

                        </div>


                    </div>

                </div>



                <!-- ========================================
                     快速操作
                ======================================== -->

                <div class="profile-actions">


                    <a
                        href="cases.html"
                        class="profile-action profile-action-primary"
                    >

                        <span class="profile-action-icon">
                            ◆
                        </span>

                        <span>

                            <strong>
                                開始開箱
                            </strong>

                            <small>
                                前往 ELOCase
                            </small>

                        </span>

                        <span class="profile-action-arrow">
                            →
                        </span>

                    </a>


                    <a
                        href="inventory.html"
                        class="profile-action"
                    >

                        <span class="profile-action-icon">
                            ◇
                        </span>

                        <span>

                            <strong>
                                我的物品
                            </strong>

                            <small>
                                查看你的收藏
                            </small>

                        </span>

                        <span class="profile-action-arrow">
                            →
                        </span>

                    </a>

                </div>



                <!-- ========================================
                     登出
                ======================================== -->

                <div class="profile-logout-area">

                    <div>

                        <span class="profile-label">
                            ACCOUNT
                        </span>

                        <h3>
                            帳號操作
                        </h3>

                        <p>
                            登出目前的 ELOCase 帳號
                        </p>

                    </div>


                    <button
                        id="logout-button"
                        class="profile-logout-button"
                        type="button"
                    >
                        登出帳號
                    </button>

                </div>


            </div>

        </section>

    </main>



    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="js/loading.js"></script>

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/player.js"></script>

    <script src="js/ui.js"></script>


    <script>

        async function initializeProfile() {

            const user =
                await requireLogin();


            if (!user) {

                return;

            }


            /* ========================================
               玩家名稱
            ======================================== */

            const displayName =
                user.displayName ||
                user.username ||
                "玩家";


            const profileName =
                document.querySelector(
                    "#profile-name"
                );


            if (profileName) {

                profileName.textContent =
                    displayName;

            }


            /* ========================================
               玩家帳號
            ======================================== */

            const username =
                user.username ||
                "-";


            const profileUsername =
                document.querySelector(
                    "#profile-username"
                );


            if (profileUsername) {

                profileUsername.textContent =
                    `玩家名稱：${username}`;

            }


            /* ========================================
               玩家名稱資訊
            ======================================== */

            const infoUsername =
                document.querySelector(
                    "#info-username"
                );


            if (infoUsername) {

                infoUsername.textContent =
                    username;

            }


            /* ========================================
               顯示名稱
            ======================================== */

            const infoDisplayName =
                document.querySelector(
                    "#info-display-name"
                );


            if (infoDisplayName) {

                infoDisplayName.textContent =
                    displayName;

            }


            /* ========================================
               ELOCoin
            ======================================== */

            const eloCoin =
                Number(
                    user.eloCoin || 0
                );


            const formattedCoin =
                eloCoin.toLocaleString();


            const profileBalance =
                document.querySelector(
                    "#profile-balance"
                );


            if (profileBalance) {

                profileBalance.textContent =
                    `$${formattedCoin}`;

            }


            /* ========================================
               等級
            ======================================== */

            const level =
                Number(
                    user.level ?? 0
                );


            const levelText =
                `Lv.${level}`;


            const profileLevel =
                document.querySelector(
                    "#profile-level"
                );


            if (profileLevel) {

                profileLevel.textContent =
                    levelText;

            }


            const infoLevel =
                document.querySelector(
                    "#info-level"
                );


            if (infoLevel) {

                infoLevel.textContent =
                    levelText;

            }


            /* ========================================
               Navbar 餘額
            ======================================== */

            const balance =
                document.querySelector(
                    ".balance-value"
                );


            if (balance) {

                balance.textContent =
                    formattedCoin;

            }


            /* ========================================
               登出
            ======================================== */

            const logoutButton =
                document.querySelector(
                    "#logout-button"
                );


            if (logoutButton) {

                logoutButton.addEventListener(
                    "click",
                    logout
                );

            }

        }


        initializeProfile();

    </script>


</body>

</html>
